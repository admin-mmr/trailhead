const Settings = ({ onClose }) => {
  const [config, setConfig] = useState(null);
  const [presets, setPresets] = useState({});
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState('');
  const [customConfig, setCustomConfig] = useState({ host: '', user: '', password: '', database: '', ssl_disabled: false });

  useEffect(() => {
    Promise.all([
      api('/api/connection/config').then(r => r.ok && setConfig(r.config)),
      api('/api/connection/presets').then(r => r.ok && setPresets(r.presets)),
    ]).then(() => setLoading(false));
  }, []);

  const applyPreset = async (preset) => {
    const r = await api('/api/connection/set', { method: 'POST', body: JSON.stringify({ preset }) });
    if (r.ok) {
      setToast(r.message);
      setTimeout(() => { window.location.reload(); }, 1000);
    } else {
      setToast(r.error || 'Failed to apply preset');
    }
  };

  const applyCustom = async () => {
    const r = await api('/api/connection/set', { method: 'POST', body: JSON.stringify(customConfig) });
    if (r.ok) {
      setToast(r.message);
      setTimeout(() => { window.location.reload(); }, 1000);
    } else {
      setToast(r.error || 'Failed to connect');
    }
  };

  return (
    <div>
      <button className="back-btn" onClick={onClose}>← Back</button>
      <h2 style={{ marginBottom: 16 }}>Database Connection Settings</h2>

      {loading ? (
        <div className="loading"><span className="spinner" /> Loading...</div>
      ) : (
        <>
          <div style={{ background: 'var(--surface)', padding: 16, borderRadius: 'var(--radius)', marginBottom: 20 }}>
            <h3 style={{ fontSize: 14, marginBottom: 12 }}>Current Connection</h3>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12, fontSize: 13 }}>
              <div><span style={{ color: 'var(--text2)' }}>Host:</span> {config?.host}</div>
              <div><span style={{ color: 'var(--text2)' }}>Database:</span> {config?.database}</div>
              <div><span style={{ color: 'var(--text2)' }}>User:</span> {config?.user}</div>
              <div><span style={{ color: 'var(--text2)' }}>SSL:</span> {config?.ssl_disabled ? 'Disabled' : 'Enabled'}</div>
            </div>
          </div>

          <h3 style={{ fontSize: 14, marginBottom: 12 }}>Quick Connect — Presets</h3>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 8, marginBottom: 24 }}>
            {Object.entries(presets).map(([name, info]) => (
              <div key={name} style={{ background: 'var(--surface)', padding: 12, borderRadius: 'var(--radius)', border: '1px solid var(--border)' }}>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, textTransform: 'capitalize' }}>{name}</div>
                <div style={{ fontSize: 11, color: 'var(--text2)', marginBottom: 8 }}>
                  <div>{info.host}</div>
                  <div>{info.user} @ {info.database}</div>
                </div>
                <button className="btn btn-sm btn-primary" onClick={() => applyPreset(name)}>Connect</button>
              </div>
            ))}
          </div>

          <h3 style={{ fontSize: 14, marginBottom: 12 }}>Custom Connection</h3>
          <div style={{ background: 'var(--surface)', padding: 16, borderRadius: 'var(--radius)', marginBottom: 16 }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 12, marginBottom: 12 }}>
              <input placeholder="Host" value={customConfig.host} onChange={e => setCustomConfig(c => ({ ...c, host: e.target.value }))} />
              <input placeholder="User" value={customConfig.user} onChange={e => setCustomConfig(c => ({ ...c, user: e.target.value }))} />
              <input placeholder="Password" type="password" value={customConfig.password} onChange={e => setCustomConfig(c => ({ ...c, password: e.target.value }))} />
              <input placeholder="Database" value={customConfig.database} onChange={e => setCustomConfig(c => ({ ...c, database: e.target.value }))} />
            </div>
            <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: 'var(--text2)', marginBottom: 12 }}>
              <input type="checkbox" checked={customConfig.ssl_disabled} onChange={e => setCustomConfig(c => ({ ...c, ssl_disabled: e.target.checked }))} />
              Disable SSL (for local dev)
            </label>
            <button className="btn btn-primary" onClick={applyCustom}>Test & Connect</button>
          </div>

          {toast && <Toast message={toast} onClose={() => setToast('')} />}
        </>
      )}
    </div>
  );
};

// ═══════════════════════════════════════════════════
// Sync Panel — MySQL ↔ Google Sheets sync
// ═══════════════════════════════════════════════════

const SyncPanel = () => {
  const [subTab, setSubTab] = useState('mysql-to-google'); // mysql-to-google | import-txns | google-to-mysql
  const [jobs, setJobs] = useState({});
  const [toast, setToast] = useState('');

  const triggerSync = async (operation, endpoint) => {
    setToast(`Starting ${operation}...`);
    try {
      const r = await api(endpoint, { method: 'POST' });
      if (r.ok) {
        const jobId = r.job_id;
        setJobs(j => ({ ...j, [jobId]: { status: 'running', message: 'Running...', progress: 0 } }));
        pollJobStatus(jobId);
        setToast(`${operation} started (Job: ${jobId.slice(0, 8)}...)`);
      } else {
        setToast(`❌ Failed to start ${operation}: ${r.error || 'Unknown error'}`);
      }
    } catch (e) {
      setToast(`❌ Error: ${e.message}`);
    }
  };

  const pollJobStatus = (jobId) => {
    const poll = setInterval(async () => {
      try {
        const r = await api(`/api/sync/status/${jobId}`);
        if (r.ok && r.data) {
          const job = r.data;
          setJobs(j => ({ ...j, [jobId]: job }));

          if (job.status === 'done' || job.status === 'error') {
            clearInterval(poll);
            if (job.status === 'done') {
              setToast(`✅ Sync complete: ${job.message}`);
            } else {
              setToast(`❌ Sync failed: ${job.message}`);
            }
          }
        }
      } catch (e) {
        console.error('Poll error:', e);
      }
    }, 1000); // Poll every second
  };

  const jobsList = Object.entries(jobs).sort((a, b) => b[0].localeCompare(a[0])); // newest first

  return (
    <div>
      {/* Sub-tabs */}
      <div className="tabs" style={{ marginBottom: 20, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
        <button
          className={`tab ${subTab === 'mysql-to-google' ? 'active' : ''}`}
          onClick={() => setSubTab('mysql-to-google')}
        >
          📤 MySQL → Google
        </button>
        <button
          className={`tab ${subTab === 'import-txns' ? 'active' : ''}`}
          onClick={() => setSubTab('import-txns')}
        >
          📥 Import Transactions
        </button>
        <button
          className={`tab ${subTab === 'google-to-mysql' ? 'active' : ''}`}
          onClick={() => setSubTab('google-to-mysql')}
        >
          🔍 Google → MySQL (dry-run)
        </button>
      </div>

      {/* MySQL → Google */}
      {subTab === 'mysql-to-google' && (
        <div>
          <h2 style={{ fontSize: 18, marginBottom: 16 }}>MySQL → Google Sheets</h2>
          <p style={{ color: 'var(--text2)', marginBottom: 20, fontSize: 14 }}>
            Sync MySQL data to Google Sheets. New records are appended; existing records are updated if MySQL is newer.
          </p>

          <div className="stats-grid" style={{ marginBottom: 20 }}>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              <button
                className="btn btn-primary"
                onClick={() => triggerSync('Members Sync', '/api/sync/mysql-to-google/members')}
              >
                👥 Sync Members
              </button>
              <button
                className="btn btn-primary"
                onClick={() => triggerSync('Events Sync', '/api/sync/mysql-to-google/events')}
              >
                📋 Sync Events
              </button>
              <button
                className="btn btn-primary"
                onClick={() => triggerSync('Payments Sync', '/api/sync/mysql-to-google/payments')}
              >
                💳 Sync Payments
              </button>
            </div>
          </div>

          {jobsList.length > 0 && (
            <div>
              <h3 style={{ fontSize: 14, marginBottom: 12 }}>Recent Jobs</h3>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {jobsList.map(([jobId, job]) => (
                  <div key={jobId} style={{ background: 'var(--surface)', padding: 12, borderRadius: 'var(--radius)', fontSize: 13 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                      <span style={{ fontFamily: 'monospace', color: 'var(--text2)' }}>{jobId.slice(0, 12)}...</span>
                      <span className={`badge ${
                        job.status === 'done' ? 'badge-green' :
                        job.status === 'error' ? 'badge-red' :
                        job.status === 'running' ? 'badge-blue' :
                        'badge-yellow'
                      }`}>
                        {job.status}
                      </span>
                    </div>
                    <div style={{ marginBottom: 6 }}>{job.message}</div>
                    {job.progress !== undefined && (
                      <div style={{ height: 4, background: 'var(--surface2)', borderRadius: 2, overflow: 'hidden' }}>
                        <div style={{ height: '100%', background: 'var(--accent)', width: `${job.progress}%`, transition: 'width 0.3s' }} />
                      </div>
                    )}
                    {job.result && (
                      <details style={{ marginTop: 8, color: 'var(--text2)', fontSize: 12 }}>
                        <summary style={{ cursor: 'pointer' }}>View Log</summary>
                        <pre style={{
                          background: 'var(--bg)',
                          padding: 8,
                          borderRadius: 4,
                          marginTop: 6,
                          overflow: 'auto',
                          maxHeight: 200,
                          fontSize: 11,
                        }}>
                          {job.result.log}
                        </pre>
                      </details>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {/* Import Transactions */}
      {subTab === 'import-txns' && (
        <div>
          <h2 style={{ fontSize: 18, marginBottom: 16 }}>Import Transactions from Google Sheets</h2>
          <p style={{ color: 'var(--text2)', marginBottom: 20, fontSize: 14 }}>
            Fetch gmail_transactions from Google Sheets. New MessageIds are inserted; existing records are updated if Memo differs from Notes.
          </p>

          <button
            className="btn btn-primary"
            onClick={() => triggerSync('Transaction Import', '/api/sync/import-transactions')}
          >
            📥 Import Now
          </button>

          {jobsList.length > 0 && (
            <div style={{ marginTop: 20 }}>
              <h3 style={{ fontSize: 14, marginBottom: 12 }}>Recent Imports</h3>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {jobsList.map(([jobId, job]) => (
                  <div key={jobId} style={{ background: 'var(--surface)', padding: 12, borderRadius: 'var(--radius)', fontSize: 13 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                      <span style={{ fontFamily: 'monospace', color: 'var(--text2)' }}>{jobId.slice(0, 12)}...</span>
                      <span className={`badge ${job.status === 'done' ? 'badge-green' : 'badge-red'}`}>
                        {job.status}
                      </span>
                    </div>
                    <div>{job.message}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {/* Google → MySQL Dry Run */}
      {subTab === 'google-to-mysql' && (
        <div>
          <h2 style={{ fontSize: 18, marginBottom: 16 }}>Google → MySQL (Dry Run)</h2>
          <p style={{ color: 'var(--text2)', marginBottom: 20, fontSize: 14 }}>
            Compare Google Sheets with MySQL and display differences. <strong>No changes are made.</strong> This is for review only.
          </p>

          <button
            className="btn btn-primary"
            onClick={() => triggerSync('Dry-Run Comparison', '/api/sync/dry-run')}
          >
            🔍 Start Dry-Run
          </button>

          {jobsList.length > 0 && (
            <div style={{ marginTop: 20 }}>
              <h3 style={{ fontSize: 14, marginBottom: 12 }}>Recent Dry-Runs</h3>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {jobsList.map(([jobId, job]) => (
                  <div key={jobId} style={{ background: 'var(--surface)', padding: 12, borderRadius: 'var(--radius)', fontSize: 13 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                      <span style={{ fontFamily: 'monospace', color: 'var(--text2)' }}>{jobId.slice(0, 12)}...</span>
                      <span className={`badge ${job.status === 'done' ? 'badge-green' : 'badge-red'}`}>
                        {job.status}
                      </span>
                    </div>
                    <div>{job.message}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {toast && <Toast message={toast} onClose={() => setToast('')} />}
    </div>
  );
};

// App shell

const App = () => {

    api('/api/version').then(r => {
      if (r.ok) setVersionInfo(r);
    });
    api('/api/me').then(r => {
      if (r.ok && r.data) {
        setUserRole(r.data.role);
        setUserEmail(r.data.email);

          setView('restricted');
        } else {
          setView('dashboard');

      <div className="app">
        <div className="access-restricted">
          <div className="access-restricted-box">
            <div className="big">🔒</div>
            <h2>Access Restricted</h2>
            <p>You are signed in as <strong>{userEmail}</strong>.</p>
            <p style={{ marginBottom: 24 }}>To request admin access, please contact <a href="mailto:admin@mmrunners.org">admin@mmrunners.org</a></p>

        </div>

    <div className="app">
      <div className="header">
        <div>
          <h1>MMR Admin Portal</h1>
          <div className="subtitle">
            Misty Mountain Runners — Event Management & Data Browser
            {versionInfo && versionInfo.commit && (
              <span style={{ marginLeft: 12, opacity: 0.5, fontSize: 11 }}
                    title={versionInfo.deployed_at ? `Deployed: ${new Date(versionInfo.deployed_at).toLocaleString()}` : ''}>
                v{versionInfo.commit}{versionInfo.deployed_at ? ` · ${new Date(versionInfo.deployed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}` : ''}
              </span>
            )}

            style={{ height: 'fit-content' }}
            onClick={() => setView('settings')}

            ⚙️ Settings
          </button>
        </div>
      </div>

      {view !== 'settings' && (
        <div className="tabs">
          <button className={`tab ${view === 'dashboard' || view === 'detail' ? 'active' : ''}`} onClick={() => setView('dashboard')}>Events</button>
          {(userRole === 'super_admin' || userRole === 'admin') && (
            <button className={`tab ${view === 'payments' ? 'active' : ''}`} onClick={() => setView('payments')}>Payments</button>
          )}
          <button className={`tab ${view === 'district' ? 'active' : ''}`} onClick={() => setView('district')}>Members by District</button>
          {(userRole === 'super_admin' || userRole === 'admin') && (
            <button className={`tab ${view === 'sync' ? 'active' : ''}`} onClick={() => setView('sync')}>Sync</button>
          )}
          <button className={`tab ${view === 'tables' ? 'active' : ''}`} onClick={() => setView('tables')}>Data Browser</button>
          <button className={`tab ${view === 'log' ? 'active' : ''}`} onClick={() => setView('log')}>Sync Log</button>
          {(userRole === 'super_admin' || userRole === 'admin') && (
            <button className={`tab ${view === 'query' ? 'active' : ''}`} onClick={() => window.location.href = '/query'}>Data Query</button>
          )}
          {(userRole === 'super_admin' || userRole === 'admin') && (
            <button className={`tab ${view === 'admins' ? 'active' : ''}`} onClick={() => setView('admins')}>Admins</button>
          )}
        </div>
      )}

      {view === 'dashboard' && <Dashboard onSelectEvent={selectEvent} onGoSettings={() => setView('settings')} />}
      {view === 'detail' && selectedEventId && <EventDetail eventId={selectedEventId} onBack={goBack} />}
      {view === 'payments' && window.PaymentsPanel && React.createElement(window.PaymentsPanel)}
      {view === 'district' && window.DistrictMembersPanel && React.createElement(window.DistrictMembersPanel)}
      {view === 'sync' && <SyncPanel />}
      {view === 'tables' && <TableBrowser />}
      {view === 'log' && <ProcessingLog />}
      {view === 'admins' && <AdminPanel userRole={userRole} userEmail={userEmail} />}
      {view === 'settings' && <Settings onClose={() => setView('dashboard')} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
