        <>
          <div style={{ background: 'var(--surface)', padding: 16, borderRadius: 'var(--radius)', marginBottom: 20 }}>
            <h3 style={{ fontSize: 14, marginBottom: 12 }}>Current Connection</h3>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12, fontSize: 13 }}>
              <div><span style={{ color: 'var(--text2)' }}>Host:</span> {config?.host}</div>
              <div><span style={{ color: 'var(--text2)' }}>Database:</span> {config?.database}</div>
              <div><span style={{ color: 'var(--text2)' }}>User:</span> {config?.user}</div>
              <div><span style={{ color: 'var(--text2)' }}>SSL:</span> {config?.ssl_disabled ? 'Disabled' : 'Enabled'}</div>
            </div>
          </div>

          <h3 style={{ fontSize: 14, marginBottom: 12 }}>Quick Connect — Presets</h3>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 8, marginBottom: 24 }}>
            {Object.entries(presets).map(([name, info]) => (
              <div key={name} style={{ background: 'var(--surface)', padding: 12, borderRadius: 'var(--radius)', border: '1px solid var(--border)' }}>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, textTransform: 'capitalize' }}>{name}</div>

                  <div>{info.user} @ {info.database}</div>

              </div>

          </div>

          <h3 style={{ fontSize: 14, marginBottom: 12 }}>Custom Connection</h3>
          <div style={{ background: 'var(--surface)', padding: 16, borderRadius: 'var(--radius)', marginBottom: 16 }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 12, marginBottom: 12 }}>
              <input placeholder="Host" value={customConfig.host} onChange={e => setCustomConfig(c => ({ ...c, host: e.target.value }))} />
              <input placeholder="User" value={customConfig.user} onChange={e => setCustomConfig(c => ({ ...c, user: e.target.value }))} />
              <input placeholder="Password" type="password" value={customConfig.password} onChange={e => setCustomConfig(c => ({ ...c, password: e.target.value }))} />
              <input placeholder="Database" value={customConfig.database} onChange={e => setCustomConfig(c => ({ ...c, database: e.target.value }))} />

            <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: 'var(--text2)', marginBottom: 12 }}>
              <input type="checkbox" checked={customConfig.ssl_disabled} onChange={e => setCustomConfig(c => ({ ...c, ssl_disabled: e.target.checked }))} />

            <button className="btn btn-primary" onClick={applyCustom}>Test & Connect</button>

          {toast && <Toast message={toast} onClose={() => setToast('')} />}

// Shared job card component used by all sync sub-tabs
const JobCard = ({ jobId, job }) => {
  const res = job.result || {};
  // Stat line: normalised keys present on all sync results
  const statParts = [
    res.inserted !== undefined ? `+${res.inserted} inserted` : null,
    res.updated  !== undefined ? `${res.updated} updated`   : null,
    res.skipped  !== undefined ? `${res.skipped} skipped`   : null,
    (() => { const ec = res.errors_count ?? (typeof res.errors === 'number' ? res.errors : (Array.isArray(res.errors) ? res.errors.length : 0)); return ec > 0 ? `${ec} errors` : null; })(),
  ].filter(Boolean);
  const statLine = statParts.length ? statParts.join(' · ') : null;
  const logText = res.log || (typeof res === 'string' ? res : null);

  return (
    <div style={{ background: 'var(--surface)', padding: 12, borderRadius: 'var(--radius)', fontSize: 13 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
        <span style={{ fontWeight: 600 }}>
          {job.jobName || '—'}
          {job.actionType ? <span style={{ color: 'var(--text2)', fontWeight: 400, marginLeft: 6 }}>· {job.actionType}</span> : null}
        </span>
        <span className={`badge ${
          job.status === 'done'    ? 'badge-green' :
          job.status === 'error'   ? 'badge-red'   :
          job.status === 'running' ? 'badge-blue'  :
          'badge-yellow'
        }`}>
          {job.status}
        </span>
      </div>
      <div style={{ color: 'var(--text2)', fontSize: 12, marginBottom: 6, fontFamily: 'monospace' }}>{jobId.slice(0, 12)}…</div>
      <div style={{ marginBottom: 6 }}>{job.message}</div>
      {job.status === 'error' && res.error && (
        <div style={{ background: '#fef2f2', border: '1px solid #fca5a5', borderRadius: 4, padding: '6px 8px', marginBottom: 6, color: '#b91c1c', fontSize: 12 }}>
          {res.error}
        </div>
      )}
      {statLine && <div style={{ fontSize: 12, color: 'var(--text2)', marginBottom: 6 }}>{statLine}</div>}
      {job.progress !== undefined && (
        <div style={{ height: 4, background: 'var(--surface2)', borderRadius: 2, overflow: 'hidden', marginBottom: 6 }}>
          <div style={{ height: '100%', background: 'var(--accent)', width: `${job.progress}%`, transition: 'width 0.3s' }} />
        </div>
      )}
      {logText && (
        <details style={{ marginTop: 6, color: 'var(--text2)', fontSize: 12 }}>
          <summary style={{ cursor: 'pointer' }}>View Log</summary>
          <pre style={{
            background: 'var(--bg)',
            padding: 8,
            borderRadius: 4,
            marginTop: 6,
            overflow: 'auto',
            maxHeight: 240,
            fontSize: 11,
            whiteSpace: 'pre-wrap',
          }}>
            {logText}
          </pre>
        </details>
      )}
    </div>
  );
};

const SyncPanel = () => {
  const [subTab, setSubTab] = useState('mysql-to-google');
  const [subTab2, setSubTab2] = useState('members-fees');
  const [jobs, setJobs] = useState({});
  const [toast, setToast] = useState('');

  // Restore jobs from server on mount so Recent Jobs survive page reload / tab switches
  useEffect(() => {
    api('/api/sync/jobs').then(r => {
      if (r && r.ok && r.jobs) setJobs(r.jobs);
    }).catch(() => {});
  }, []);

  const triggerSync = async (jobName, actionType, endpoint) => {
    setToast(`Starting ${jobName}…`);
    try {
      const r = await api(endpoint, { method: 'POST' });
      if (r.ok) {
        const jobId = r.job_id;
        setJobs(j => ({ ...j, [jobId]: { status: 'running', message: 'Running…', progress: 0, jobName, actionType } }));
        pollJobStatus(jobId);
        setToast(`${jobName} started (Job: ${jobId.slice(0, 8)}…)`);
      } else {
        setToast(`❌ Failed to start ${jobName}: ${r.error || 'Unknown error'}`);
      }
    } catch (e) {
      setToast(`❌ Error: ${e.message}`);
    }
  };

  const pollJobStatus = (jobId) => {
    const poll = setInterval(async () => {
      try {
        const r = await api(`/api/sync/status/${jobId}`);
        if (r.ok && r.data) {
          const job = r.data;
          setJobs(j => ({ ...j, [jobId]: { ...j[jobId], ...job } }));
          if (job.status === 'done' || job.status === 'error') {
            clearInterval(poll);
            setToast(job.status === 'done' ? `✅ ${job.message}` : `❌ ${job.message}`);
          }
        }
      } catch (e) {
        console.error('Poll error:', e);
      }
    }, 1000);
  };

  const jobsList = Object.entries(jobs).sort((a, b) => b[0].localeCompare(a[0]));

  // RecentJobs filtered to the current sub-tab so jobs don't bleed across tabs.
  // Pass filterFn to override; pass g2mTab to further filter inside Google→MySQL.
  const RecentJobs = ({ label = 'Recent Jobs', filterFn }) => {
    const filtered = filterFn ? jobsList.filter(([, job]) => filterFn(job)) : jobsList;
    return filtered.length === 0 ? null : (
      <div style={{ marginTop: 20 }}>
        <h3 style={{ fontSize: 14, marginBottom: 12 }}>{label}</h3>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {filtered.map(([jobId, job]) => <JobCard key={jobId} jobId={jobId} job={job} />)}
        </div>
      </div>
    );
  };

  return (
    <div>
      {/* Sub-tabs */}
      <div className="tabs" style={{ marginBottom: 20, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
        <button className={`tab ${subTab === 'mysql-to-google' ? 'active' : ''}`} onClick={() => setSubTab('mysql-to-google')}>📤 MySQL → Google</button>
        <button className={`tab ${subTab === 'import-txns' ? 'active' : ''}`} onClick={() => setSubTab('import-txns')}>📥 Import Transactions</button>
        <button className={`tab ${subTab === 'sync-unprocessed-txns' ? 'active' : ''}`} onClick={() => setSubTab('sync-unprocessed-txns')}>🔄 Sync Unprocessed Txns</button>
        <button className={`tab ${subTab === 'google-to-mysql' ? 'active' : ''}`} onClick={() => setSubTab('google-to-mysql')}>📥 Google → MySQL</button>
        <button className={`tab ${subTab === 'members-table' ? 'active' : ''}`} onClick={() => setSubTab('members-table')}>👥 Members Table</button>
        <button className={`tab ${subTab === 'full-sync' ? 'active' : ''}`} onClick={() => setSubTab('full-sync')}>🔄 Full Sync</button>
      </div>

      {/* MySQL → Google */}
      {subTab === 'mysql-to-google' && (
        <div>
          <h2 style={{ fontSize: 18, marginBottom: 16 }}>MySQL → Google Sheets</h2>
          <p style={{ color: 'var(--text2)', marginBottom: 20, fontSize: 14 }}>
            Sync MySQL data to Google Sheets. New records are appended; existing records are updated if MySQL is newer.
          </p>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 20 }}>
            <button className="btn btn-primary" onClick={() => triggerSync('MySQL → Google', 'Members', '/api/sync/mysql-to-google/members')}>👥 Sync Members</button>
            <button className="btn btn-primary" onClick={() => triggerSync('MySQL → Google', 'Events', '/api/sync/mysql-to-google/events')}>📋 Sync Events</button>
            <button className="btn btn-primary" onClick={() => triggerSync('MySQL → Google', 'Payments', '/api/sync/mysql-to-google/payments')}>💳 Sync Payments</button>
          </div>
          <RecentJobs filterFn={job => job.jobName === 'MySQL → Google'} />
        </div>
      )}

      {/* Import Transactions (Google Sheets → MySQL) */}
      {subTab === 'import-txns' && (
        <div>
          <h2 style={{ fontSize: 18, marginBottom: 16 }}>Import Transactions from Google Sheets</h2>
          <p style={{ color: 'var(--text2)', marginBottom: 20, fontSize: 14 }}>
            Fetch gmail_transactions from Google Sheets. New MessageIds are inserted; existing records are updated if the Sheets Memo differs from MySQL Notes.
          </p>
          <button className="btn btn-primary" onClick={() => triggerSync('Import Transactions', 'Google → MySQL', '/api/sync/import-transactions')}>📥 Import Now</button>
          <RecentJobs label="Recent Imports" filterFn={job => job.jobName === 'Import Transactions'} />
        </div>
      )}

      {/* Sync Unprocessed Transactions (MySQL → Google Sheets) */}
      {subTab === 'sync-unprocessed-txns' && (
        <div>
          <h2 style={{ fontSize: 18, marginBottom: 16 }}>Sync Unprocessed Transactions → Google Sheets</h2>
          <p style={{ color: 'var(--text2)', marginBottom: 20, fontSize: 14 }}>
            Sync transactions with ProcessedTime = NULL from MySQL to Google Sheets. Updates Notes, ProcessedTime, and WebAppID.
          </p>
          <button className="btn btn-primary" onClick={() => triggerSync('Sync Unprocessed Txns', 'MySQL → Google', '/api/sync/unprocessed-transactions')}>🔄 Sync Unprocessed</button>
          <RecentJobs label="Recent Syncs" filterFn={job => job.jobName === 'Sync Unprocessed Txns'} />
        </div>
      )}

      {/* Google → MySQL */}
      {subTab === 'google-to-mysql' && (
        <GoogleToMySQLPanel triggerSync={triggerSync} RecentJobs={RecentJobs} />
      )}

      {/* Members Table — nested sub-tabs */}
      {subTab === 'members-table' && (
        <div>
          <div className="tabs" style={{ marginBottom: 16, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
            <button className={`tab ${subTab === 'members-table' && !['members-fees', 'members-lastupdated', 'members-unix'].includes(subTab2) ? 'active' : subTab2 === 'members-fees' ? 'active' : ''}`} onClick={() => setSubTab2('members-fees')}>💳 Membership Fees</button>
            <button className={`tab ${subTab2 === 'members-lastupdated' ? 'active' : ''}`} onClick={() => setSubTab2('members-lastupdated')}>🕐 Sync LastUpdated</button>
            <button className={`tab ${subTab2 === 'members-unix' ? 'active' : ''}`} onClick={() => setSubTab2('members-unix')}>⏱️ Backfill Unix Timestamps</button>
          </div>

          {/* Membership Fees Sub-tab */}
          {subTab2 !== 'members-lastupdated' && (
            <div>
              <h2 style={{ fontSize: 18, marginBottom: 16 }}>Sync Membership Fees to Members</h2>
              <p style={{ color: 'var(--text2)', marginBottom: 20, fontSize: 14 }}>
                Update members table with payment data from the payments table. For each member with an
                Individual or Family Membership payment, syncs the most recent payment date, amount, and
                transaction reference. Updates only if the new payment is more recent than existing data.
              </p>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 20 }}>
                <button className="btn btn-primary" onClick={() => {
                  const memberID = prompt('Enter MemberID (leave blank to sync all):');
                  const payload = memberID ? { memberID } : {};
                  api('/api/sync/membership-fees', { method: 'POST', body: JSON.stringify(payload) })
                    .then(r => {
                      if (r.ok) {
                        setToast(`✅ ${r.message} (${r.stats.updated}/${r.stats.checked} updated)`);
                      } else {
                        setToast(`❌ Error: ${r.error || 'Unknown error'}`);
                      }
                    })
                    .catch(e => setToast(`❌ Error: ${e.message}`));
                }}>💳 Sync Membership Fees</button>
              </div>
              <div style={{ background: 'var(--surface)', border: '1px solid var(--accent)', borderRadius: 'var(--radius)', padding: 12, fontSize: 12, color: 'var(--text2)' }}>
                <strong>ℹ️ Manual sync:</strong> Click the button above to sync all members, or enter a MemberID to sync a specific member.
              </div>
            </div>
          )}

          {/* Sync LastUpdated Sub-tab */}
          {subTab2 === 'members-lastupdated' && (
            <div>
              <h2 style={{ fontSize: 18, marginBottom: 16 }}>Sync LastUpdated from Member Log</h2>
              <p style={{ color: 'var(--text2)', marginBottom: 20, fontSize: 14 }}>
                Synchronize the LastUpdated column in members table from the member_log audit trail.
                For each member, if the most recent LoggingTime in member_log is newer than the current
                LastUpdated in members, updates LastUpdated to that LoggingTime.

// Python Execution Panel
// ═══════════════════════════════════════════════════
const PythonExecPanel = () => {
  const [functions, setFunctions] = useState([]);
  const [selectedFn, setSelectedFn] = useState(null);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState('');

  useEffect(() => {
    api('/api/py-exec/list').then(r => {
      if (r && r.functions && Array.isArray(r.functions)) {
        setFunctions(r.functions);
        if (r.functions.length > 0) setSelectedFn(r.functions[0].name);
      } else {
        console.warn('Failed to load functions:', r);
      }
    }).catch(err => {
      console.error('API error:', err);
    });
  }, []);

  const runFunction = async () => {
    if (!selectedFn) return;
    setLoading(true);
    setResult(null);

    const r = await api(`/api/py-exec/run/${selectedFn}`, {
      method: 'POST',
      body: JSON.stringify({ kwargs: {} })
    });

    setLoading(false);
    if (r.ok || r.function) {
      setResult(r);
      setToast('✓ Execution complete');
    } else {
      setToast('✗ Execution failed');
      setResult(r);
    }
  };

  const downloadResult = () => {
    if (!result) return;
    const json = JSON.stringify(result, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `py-exec-${selectedFn}-${new Date().toISOString()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <h2 style={{ marginBottom: 16 }}>Python Execution Engine</h2>
      <div style={{ background: 'var(--surface)', border: '1px solid var(--accent)', borderRadius: 'var(--radius)', padding: 16, marginBottom: 20 }}>
        <p style={{ color: 'var(--text2)', fontSize: 13, marginBottom: 8 }}>
          Run diagnostic functions to inspect data sync, transactions, and database state.
        </p>
        <p style={{ color: 'var(--text2)', fontSize: 12, fontStyle: 'italic' }}>
          All functions are read-only and safe to execute in Azure.
        </p>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '200px 1fr', gap: 16, marginBottom: 20 }}>
        {/* Function List */}
        <div style={{ background: 'var(--surface)', borderRadius: 'var(--radius)', overflow: 'hidden', border: '1px solid var(--border)' }}>
          <div style={{ padding: 12, borderBottom: '1px solid var(--border)', fontWeight: 600, fontSize: 13 }}>Functions</div>
          <div style={{ maxHeight: 400, overflowY: 'auto' }}>
            {functions.map(fn => (
              <button
                key={fn.name}
                onClick={() => setSelectedFn(fn.name)}
                style={{
                  width: '100%',
                  padding: 10,
                  textAlign: 'left',
                  background: selectedFn === fn.name ? 'var(--accent)' : 'transparent',
                  color: selectedFn === fn.name ? 'var(--bg)' : 'var(--text)',
                  border: 'none',
                  cursor: 'pointer',
                  fontSize: 12,
                  borderBottom: '1px solid var(--surface2)',
                  fontWeight: selectedFn === fn.name ? 600 : 400,
                }}
              >
                {fn.name}
              </button>
            ))}
          </div>
        </div>

        {/* Main Panel */}
        <div>
          {selectedFn && (
            <>
              <div style={{ background: 'var(--surface)', padding: 16, borderRadius: 'var(--radius)', marginBottom: 16, border: '1px solid var(--border)' }}>
                <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>{selectedFn}</h3>
                <p style={{ fontSize: 13, color: 'var(--text2)', marginBottom: 12 }}>
                  {functions.find(f => f.name === selectedFn)?.description || 'No description'}
                </p>
                <button
                  className="btn btn-primary"
                  onClick={runFunction}
                  disabled={loading}
                >
                  {loading ? '⏳ Running...' : '▶ Execute'}
                </button>
              </div>

              {/* Results */}
              {result && (
                <div style={{ background: 'var(--surface2)', padding: 16, borderRadius: 'var(--radius)', border: '1px solid var(--border)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                    <h4 style={{ fontSize: 13, fontWeight: 600 }}>
                      {result.status === 'ok' ? '✅ Success' : '❌ Error'}
                    </h4>
                    <button className="btn btn-sm btn-outline" onClick={downloadResult}>
                      📥 Download JSON
                    </button>
                  </div>
                  <pre style={{
                    background: 'var(--bg)',
                    border: '1px solid var(--border)',
                    padding: 12,
                    borderRadius: 4,
                    fontSize: 11,
                    overflow: 'auto',
                    maxHeight: 400,
                    color: 'var(--text)',
                    fontFamily: 'monospace'
                  }}>
                    {JSON.stringify(result, null, 2)}
                  </pre>
                </div>
              )}
            </>
          )}
        </div>
      </div>

      {toast && <Toast message={toast} onClose={() => setToast('')} />}
    </div>
  );
};

const PythonCodeEditor = () => {
  const [code, setCode] = useState(`# Example: Query the database
results = query("SELECT COUNT(*) as cnt FROM webapp_events")
print(f"Total events: {results[0]['cnt']}")

# Available helpers:
# - query(sql) — Execute SELECT, returns list of dicts
# - execute(sql, params) — Execute INSERT/UPDATE/DELETE
# - datetime — Python datetime module
# - json — JSON module
# - traceback — For error handling
`);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState('');

  const runCode = async () => {
    setLoading(true);
    setResult(null);

    const r = await api('/api/py-exec/code', {
      method: 'POST',
      body: JSON.stringify({ code })
    });

    setLoading(false);

    if (r.status === 'ok' || r.status === 'error') {
      setResult(r);
      setToast(r.status === 'ok' ? '✓ Executed' : '✗ Error');
    } else {
      setToast('❌ Request failed');
      setResult(r);
    }
  };

  const downloadResult = () => {
    if (!result) return;
    const text = `# Code:\n${code}\n\n# Result:\n${result.output || ''}\n${result.error ? `\n# Error:\n${result.error}\n${result.traceback}` : ''}`;
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `python-${new Date().toISOString()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const clearCode = () => {
    if (confirm('Clear all code?')) {
      setCode('');
    }
  };

  const insertExample = (example) => {
    setCode(prev => prev + '\n\n' + example);
  };

  return (
    <div>
      <h2 style={{ marginBottom: 16 }}>Python Code Editor</h2>
      <div style={{ background: 'var(--surface)', border: '1px solid var(--accent)', borderRadius: 'var(--radius)', padding: 16, marginBottom: 20 }}>
        <p style={{ color: 'var(--text2)', fontSize: 13, marginBottom: 8 }}>
          Write and execute Python code with access to the database.
        </p>
        <p style={{ color: 'var(--text2)', fontSize: 12, fontStyle: 'italic' }}>
          Available: query(sql), execute(sql, params), datetime, json, traceback
        </p>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 300px', gap: 16, marginBottom: 20 }}>
        {/* Editor */}
        <div>
          <div style={{ marginBottom: 8, display: 'flex', gap: 8, alignItems: 'center' }}>
            <h3 style={{ fontSize: 14, fontWeight: 600, flex: 1 }}>Code</h3>
            <button className="btn btn-sm btn-outline" onClick={clearCode}>Clear</button>
            <button className="btn btn-sm btn-primary" onClick={runCode} disabled={loading}>
              {loading ? '⏳ Running...' : '▶ Run'}
            </button>
          </div>
          <textarea
            value={code}
            onChange={e => setCode(e.target.value)}
            style={{
              width: '100%',
              height: 400,
              background: 'var(--bg)',
              border: '1px solid var(--border)',
              color: 'var(--text)',
              padding: 12,
              borderRadius: 'var(--radius)',
              fontFamily: 'monospace',
              fontSize: 12,
              outline: 'none',
              resize: 'vertical'
            }}
            spellCheck="false"
          />
        </div>

        {/* Examples Sidebar */}
        <div style={{ background: 'var(--surface)', borderRadius: 'var(--radius)', padding: 12, border: '1px solid var(--border)', height: 'fit-content' }}>
          <h4 style={{ fontSize: 12, fontWeight: 600, marginBottom: 12, textTransform: 'uppercase' }}>Examples</h4>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <button
              className="btn btn-sm btn-outline"
              style={{ fontSize: 11, textAlign: 'left', justifyContent: 'flex-start' }}
              onClick={() => insertExample(`# Count all events
results = query("SELECT COUNT(*) as cnt FROM webapp_events")
print(f"Total events: {results[0]['cnt']}")`)}
            >
              Count Events
            </button>
            <button
              className="btn btn-sm btn-outline"
              style={{ fontSize: 11, textAlign: 'left', justifyContent: 'flex-start' }}
              onClick={() => insertExample(`# List recent syncs
results = query("""
  SELECT id, action, status, inserted, updated
  FROM sync_log
  ORDER BY created_at DESC
  LIMIT 10
""")
for row in results:
  print(f"{row['action']}: {row['status']} ({row['inserted']} ins, {row['updated']} upd)")`)}
            >
              Recent Syncs
            </button>
            <button
              className="btn btn-sm btn-outline"
              style={{ fontSize: 11, textAlign: 'left', justifyContent: 'flex-start' }}
              onClick={() => insertExample(`# Find duplicate transactions
results = query("""
  SELECT bib_id, transaction_date, COUNT(*) as cnt

  LIMIT 20
""")
print(f"Found {len(results)} duplicate groups")`)}
            >
              Transaction Dups
            </button>
            <button
              className="btn btn-sm btn-outline"
              style={{ fontSize: 11, textAlign: 'left', justifyContent: 'flex-start' }}
              onClick={() => insertExample(`# Check NULL values
results = query("""
  SELECT
    'NULL bib_id' as issue, COUNT(*) as cnt

  FROM transactions WHERE amount IS NULL
""")
for row in results:
  print(f"{row['issue']}: {row['cnt']}")`)}
            >
              NULL Checks
            </button>
            <button
              className="btn btn-sm btn-outline"
              style={{ fontSize: 11, textAlign: 'left', justifyContent: 'flex-start' }}
              onClick={() => insertExample(`# Pretty print results

            >
              Pretty Print
            </button>
          </div>
        </div>
      </div>

      {/* Results */}
      {result && (
        <div style={{ background: 'var(--surface2)', padding: 16, borderRadius: 'var(--radius)', border: '1px solid var(--border)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
            <h4 style={{ fontSize: 13, fontWeight: 600 }}>
              {result.status === 'ok' ? '✅ Success' : '❌ Error'}
            </h4>
            <button className="btn btn-sm btn-outline" onClick={downloadResult}>
              📥 Download
            </button>
          </div>

          {result.output && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, color: 'var(--text2)', marginBottom: 6 }}>Output:</div>
              <pre style={{
                background: 'var(--bg)',
                border: '1px solid var(--border)',
                padding: 12,
                borderRadius: 4,
                fontSize: 12,
                overflow: 'auto',
                maxHeight: 300,
                color: 'var(--green)',
                fontFamily: 'monospace'
              }}>
                {result.output}
              </pre>
            </div>
          )}

          {result.error && (
            <div>
              <div style={{ fontSize: 11, color: 'var(--text2)', marginBottom: 6 }}>Error:</div>
              <pre style={{
                background: 'var(--bg)',
                border: '1px solid var(--red)',
                padding: 12,
                borderRadius: 4,
                fontSize: 11,
                overflow: 'auto',
                maxHeight: 300,
                color: 'var(--red)',
                fontFamily: 'monospace'
              }}>
                {result.error}

              {result.traceback && (
                <details style={{ marginTop: 8, color: 'var(--text2)', fontSize: 11 }}>

                    background: 'var(--bg)',

        </div>
      )}

      {view === 'dashboard' && <Dashboard onSelectEvent={selectEvent} onGoSettings={() => setView('settings')} />}
      {view === 'detail' && selectedEventId && <EventDetail eventId={selectedEventId} onBack={goBack} />}
      {view === 'payments' && window.PaymentsPanel && React.createElement(window.PaymentsPanel)}
      {view === 'members' && window.MembersPanel && React.createElement(window.MembersPanel)}
      {view === 'district' && window.DistrictMembersPanel && React.createElement(window.DistrictMembersPanel)}
      {view === 'audit' && window.AuditPanel && React.createElement(window.AuditPanel)}
      {view === 'sync' && <SyncPanel />}
      {view === 'tables' && <TableBrowser />}
      {view === 'log' && <ProcessingLog />}
      {view === 'admins' && <AdminPanel userRole={userRole} userEmail={userEmail} />}
      {view === 'pyexec' && <PythonExecPanel />}
      {view === 'pycode' && <PythonCodeEditor />}
      {view === 'settings' && <Settings onClose={() => setView('dashboard')} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
