<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMR Admin Portal</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="/static/utils.js"></script>
  <script src="/static/ManualEventMatchModal.js"></script>
  <script type="text/babel" src="/static/PaymentsPanel.js"></script>
  <script src="/static/tableGroups.js"></script>
  <script src="/static/component-loader.js"></script>
  <script type="text/babel" src="/static/DistrictMembersPanel.js"></script>
  <script type="text/babel" src="/static/AuditPanel.js"></script>
  <script type="text/babel" src="/static/Members.js"></script>
  <!-- External components (extracted for modularity) -->
  <script type="text/babel" src="/templates/dashboard-panel.html"></script>
  <script type="text/babel" src="/templates/python-code-editor.html"></script>
  <script type="text/babel" src="/templates/python-exec-panel.html"></script>
  <script type="text/babel" src="/templates/table-browser.html"></script>
  <script type="text/babel" src="/templates/match-modal.html"></script>
  <script type="text/babel" src="/templates/admin-panel.html"></script>
  <script type="text/babel" src="/templates/settings-panel.html"></script>
  <script type="text/babel" src="/templates/sync-panel.html"></script>
  <script type="text/babel" src="/templates/processing-log.html"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── API helpers ──
const api = async (path, opts = {}) => {
  const resp = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  return resp.json();
};
window.api = api;  // expose for external scripts (payments.js)

// ── Status badge ──
const StatusBadge = ({ status }) => {
  const cls = { Completed: 'green', Pending: 'yellow', InProgress: 'blue', Error: 'red' }[status] || 'blue';
  return <span className={`badge badge-${cls}`}>{status}</span>;
};

// ── Match % bar ──
const MatchBar = ({ pct }) => {
  const color = pct >= 90 ? 'var(--green)' : pct >= 70 ? 'var(--yellow)' : 'var(--red)';
  return (
    <span>
      <span className="progress-bar"><span className="progress-fill" style={{ width: `${pct}%`, background: color }} /></span>
      <span style={{ fontSize: 12 }}>{pct}%</span>
    </span>
  );
};

// ── Toast ──
const Toast = ({ message, onClose }) => {
  useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, []);
  return message ? <div className="toast">{message}</div> : null;
};

// ═══════════════════════════════════════════════════
// MatchModal — manual runner-to-member matching
// ═══════════════════════════════════════════════════
// MatchModal component loaded from external file
// match-modal.html will define window.MatchModal

// AdminPanel component loaded from external file
// admin-panel.html will define window.AdminPanel

// ═══════════════════════════════════════════════════
// SimpleProgressModal — polling status from backend
// ═══════════════════════════════════════════════════
const SimpleProgressModal = ({ isOpen, eventCode, onClose }) => {
  const [status, setStatus] = useState(null);
  const [pollingId, setPollingId] = useState(null);

  useEffect(() => {
    if (!isOpen || !eventCode) {
      if (pollingId) clearInterval(pollingId);
      return;
    }

    const poll = setInterval(async () => {
      try {
        const s = await api(`/api/load/${eventCode}/status`);
        setStatus(s);
        if (s.status === 'done' || s.status === 'error') {
          clearInterval(poll);
          setTimeout(onClose, 1000); // Close after 1 sec to show final state
        }
      } catch (e) {
        console.error('Status poll error:', e);
      }
    }, 5000); // Poll every 5 seconds

    setPollingId(poll);
    return () => clearInterval(poll);
  }, [isOpen, eventCode]);

  if (!isOpen || !status || status.status === 'not_found') return null;

  const step = status.step || 'unknown';
  const stepNum = step.includes('step1') ? 1 : step.includes('step2') ? 2 : step.includes('step3') ? 3 : 0;
  const message = status.message || 'Processing...';
  const rowsWritten = status.rows_written || 0;
  const teamsProcessed = status.teams_processed || 0;
  const isDone = status.status === 'done';
  const isError = status.status === 'error';

  return (
    <div className="modal-overlay">
      <div className="modal-content">
        <div className="modal-title">{isDone ? '✅ Done!' : isError ? '❌ Error' : status.status === 'cancelled' ? '🛑 Cancelled' : '⏳ Loading...'}</div>
        <div className="modal-subtitle">{message}</div>

        <div style={{ marginBottom: 20, fontSize: 13, color: 'var(--text2)' }}>
          <div style={{ marginBottom: 8 }}>
            <strong>Step {stepNum}:</strong> {
              stepNum === 1 ? 'Fetching runners' :
              stepNum === 2 ? 'Fetching teams' :
              stepNum === 3 ? 'Backfilling team codes' :
              'Initializing'
            }
          </div>
          {rowsWritten > 0 && <div style={{ marginBottom: 4 }}>📊 Runners: {rowsWritten.toLocaleString()}</div>}
          {teamsProcessed > 0 && <div>👥 Teams processed: {teamsProcessed}</div>}
        </div>

        {!isDone && !isError && (
          <div className="loading-dots">
            <div className="loading-dot" />
            <div className="loading-dot" />
            <div className="loading-dot" />
          </div>
        )}

        {(isDone || isError || status.status === 'cancelled') && (
          <button className="btn btn-primary" onClick={onClose} style={{ width: '100%', marginTop: 16 }}>
            Close
          </button>
        )}
        {!isDone && !isError && status.status !== 'cancelled' && (
          <button className="btn btn-danger" onClick={async () => {
            await api(`/api/load/${eventCode}/cancel`, { method: 'POST' });
          }} style={{ width: '100%', marginTop: 16, background: 'var(--danger, #ef4444)', color: '#fff', border: 'none' }}>
            Cancel
          </button>
        )}
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════
// Dashboard view
// ═══════════════════════════════════════════════════
// Dashboard & EventDetail components loaded from external file
// ═══════════════════════════════════════════════════
// dashboard-panel.html will define window.Dashboard and window.EventDetail

// ═══════════════════════════════════════════════════
// Table browser view
// ═══════════════════════════════════════════════════
// TableBrowser component loaded from external file
// table-browser.html will define window.TableBrowser

// ═══════════════════════════════════════════════════
// Settings view
// ═══════════════════════════════════════════════════
// Settings component loaded from external file
// settings-panel.html will define window.Settings

// ═══════════════════════════════════════════════════
// Sync Panel — MySQL ↔ Google Sheets sync
// ═══════════════════════════════════════════════════
// SyncPanel and JobCard components loaded from external file
// sync-panel.html will define window.SyncPanel

// ═══════════════════════════════════════════════════
// Processing Log
// ═══════════════════════════════════════════════════
// ProcessingLog component loaded from external file
// processing-log.html will define window.ProcessingLog

// ═══════════════════════════════════════════════════
// Python Execution Panel
// PythonExecPanel component loaded from external file
// python-exec-panel.html will define window.PythonExecPanel

// ═══════════════════════════════════════════════════
// Python Code Editor
// ═══════════════════════════════════════════════════
// PythonCodeEditor component loaded from external file
// ═══════════════════════════════════════════════════
// python-code-editor.html will define window.PythonCodeEditor

// ═══════════════════════════════════════════════════
// App shell
// ═══════════════════════════════════════════════════
const App = () => {
  const [view, setView] = useState('loading'); // loading | restricted | dashboard | detail | tables | log | settings | admins | pyexec | pycode
  const [selectedEventId, setSelectedEventId] = useState(null);
  const [userRole, setUserRole] = useState(null);
  const [userEmail, setUserEmail] = useState('');
  const [versionInfo, setVersionInfo] = useState(null);

  useEffect(() => {
    api('/api/version').then(r => {
      if (r.ok) setVersionInfo(r);
    });
    api('/api/me').then(r => {
      if (r.ok && r.data) {
        setUserRole(r.data.role);
        setUserEmail(r.data.email);
        if (r.data.role === 'none') {
          setView('restricted');
        } else {
          setView('payments');
        }
      } else if (r.status === 401 || r.status === 403 || r.redirect) {
        window.location = '/login';
      } else {
        setView('payments');
      }
    });
  }, []);

  const selectEvent = (id) => { setSelectedEventId(id); setView('detail'); };
  const goBack = () => { setSelectedEventId(null); setView('dashboard'); };

  const handleSignOut = () => {
    window.location = '/logout';
  };

  if (view === 'loading') {
    return (
      <div className="app">
        <div className="loading"><span className="spinner" /> Initializing...</div>
      </div>
    );
  }

  if (view === 'restricted') {
    return (
      <div className="app">
        <div className="access-restricted">
          <div className="access-restricted-box">
            <div className="big">🔒</div>
            <h2>Access Restricted</h2>
            <p>You are signed in as <strong>{userEmail}</strong>.</p>
            <p style={{ marginBottom: 24 }}>To request admin access, please contact <a href="mailto:admin@mmrunners.org">admin@mmrunners.org</a></p>
            <button className="btn btn-primary" onClick={handleSignOut}>Sign out</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="app">
      <div className="header">
        <div>
          <h1>MMR Admin Portal</h1>
          <div className="subtitle">
            Misty Mountain Runners — Event Management & Data Browser
            {versionInfo && versionInfo.commit && (
              <span style={{ marginLeft: 12, opacity: 0.5, fontSize: 11 }}
                    title={versionInfo.deployed_at ? `Deployed: ${new Date(versionInfo.deployed_at).toLocaleString()}` : ''}>
                v{versionInfo.commit}{versionInfo.deployed_at ? ` · ${new Date(versionInfo.deployed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}` : ''}
              </span>
            )}
          </div>
        </div>
        <div className="header-right">
          {userEmail && (
            <div className="user-info">
              <span className="user-email">{userEmail}</span>
              <span className="user-signout" onClick={handleSignOut}>Sign out</span>
            </div>
          )}
          <button
            className="btn btn-outline"
            style={{ height: 'fit-content' }}
            onClick={() => setView('settings')}
          >
            ⚙️ Settings
          </button>
        </div>
      </div>

      {view !== 'settings' && (
        <>
          {/* Top-level tabs: Payments, Members, Sync, Admins, Data Browser, NYRR Todos */}
          <div className="tabs">
            {(userRole === 'super_admin' || userRole === 'admin') && (
              <button className={`tab ${view === 'payments' ? 'active' : ''}`} onClick={() => setView('payments')}>Payments</button>
            )}
            {(userRole === 'super_admin' || userRole === 'admin') && (
              <button className={`tab ${view === 'members' || view === 'district' || view === 'audit' ? 'active' : ''}`} onClick={() => setView('members')}>Members</button>
            )}
            {(userRole === 'super_admin' || userRole === 'admin') && (
              <button className={`tab ${view === 'sync' ? 'active' : ''}`} onClick={() => setView('sync')}>Sync with Google</button>
            )}
            {(userRole === 'super_admin' || userRole === 'admin') && (
              <button className={`tab ${view === 'admins' || view === 'log' || view === 'pyexec' ? 'active' : ''}`} onClick={() => setView('admins')}>Admins</button>
            )}
            <button className={`tab ${view === 'tables' ? 'active' : ''}`} onClick={() => setView('tables')}>Data Browser</button>
            <button className={`tab ${view === 'dashboard' || view === 'detail' ? 'active' : ''}`} onClick={() => setView('dashboard')}>NYRR Todos</button>
          </div>

          {/* Members sub-tabs: Members, Members by District, Renewal Audit */}
          {view === 'members' || view === 'district' || view === 'audit' ? (
            <div className="tabs" style={{ marginBottom: 16, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'members' ? 'active' : ''}`} onClick={() => setView('members')}>Members</button>
              )}
              <button className={`tab ${view === 'district' ? 'active' : ''}`} onClick={() => setView('district')}>Members by District</button>
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'audit' ? 'active' : ''}`} onClick={() => setView('audit')}>🔍 Renewal Audit</button>
              )}
            </div>
          ) : null}

          {/* Admins sub-tabs: Admins, Sync Log, Python Exec, Data Query */}
          {view === 'admins' || view === 'log' || view === 'pyexec' ? (
            <div className="tabs" style={{ marginBottom: 16, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'admins' ? 'active' : ''}`} onClick={() => setView('admins')}>Admins</button>
              )}
              <button className={`tab ${view === 'log' ? 'active' : ''}`} onClick={() => setView('log')}>Sync Log</button>
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'pyexec' ? 'active' : ''}`} onClick={() => setView('pyexec')}>Python Exec</button>
              )}
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'query' ? 'active' : ''}`} onClick={() => window.location.href = '/query'}>Data Query</button>
              )}
            </div>
          ) : null}
        </>
      )}

      {view === 'dashboard' && <Dashboard onSelectEvent={selectEvent} onGoSettings={() => setView('settings')} />}
      {view === 'detail' && selectedEventId && <EventDetail eventId={selectedEventId} onBack={goBack} />}
      {view === 'dashboard' && window.Dashboard && React.createElement(window.Dashboard, { onSelectEvent: selectEvent, onGoSettings: () => setView('settings') })}
      {view === 'detail' && selectedEventId && window.EventDetail && React.createElement(window.EventDetail, { eventId: selectedEventId, onBack: goBack })}
      {view === 'payments' && window.PaymentsPanel && React.createElement(window.PaymentsPanel)}
      {view === 'members' && window.MembersPanel && React.createElement(window.MembersPanel)}
      {view === 'district' && window.DistrictMembersPanel && React.createElement(window.DistrictMembersPanel)}
      {view === 'audit' && window.AuditPanel && React.createElement(window.AuditPanel)}
      {view === 'sync' && window.SyncPanel && React.createElement(window.SyncPanel)}
      {view === 'tables' && window.TableBrowser && React.createElement(window.TableBrowser)}
      {view === 'log' && window.ProcessingLog && React.createElement(window.ProcessingLog)}
      {view === 'admins' && window.AdminPanel && React.createElement(window.AdminPanel, { userRole, userEmail })}
      {view === 'pyexec' && window.PythonExecPanel && React.createElement(window.PythonExecPanel)}
      {view === 'pycode' && window.PythonCodeEditor && React.createElement(window.PythonCodeEditor)}
      {view === 'settings' && window.Settings && React.createElement(window.Settings, { onClose: () => setView('dashboard') })}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
