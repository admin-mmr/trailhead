<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── API helpers ──
const api = async (path, opts = {}) => {
  const resp = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  try {
    return await resp.json();
  } catch (_) {
    // Non-JSON body (e.g. unexpected HTML error page from server)
    return { ok: false, error: `Server error (HTTP ${resp.status})` };
  }
};
window.api = api;  // expose for external scripts (payments.js)

// ── pollUntilDone — shared polling utility ──────────────────────────────────
// Single source of truth for all sync job polling. Handles every stop
// condition so individual components don't need to re-implement them:
//   • status 'done' / 'error'  — normal completion
//   • !r.ok (e.g. 404 TTL expiry) — backend expired the job
//   • network / parse errors   — fetch threw or returned non-JSON
//   • maxPolls safety cap       — prevents runaway intervals forever
//
// Returns a cleanup function — call it from a useEffect return or a ref.
//
// Usage:
//   const cleanup = window.pollUntilDone(jobId, {
//     onDone:     (job) => { /* success */ },
//     onError:    (job) => { /* failure or expiry */ },
//     onProgress: (job) => { /* update UI each tick */ },
//     intervalMs: 2000,   // default
//     maxPolls:   150,    // default: 150 × 2s = 5 min safety cap
//   });
//   // later: cleanup();
window.pollUntilDone = function(jobId, {
  onDone     = () => {},
  onError    = () => {},
  onProgress = () => {},
  intervalMs = 2000,
  maxPolls   = 150,
} = {}) {
  let count = 0;
  const id = setInterval(async () => {
    count++;
    try {
      const r = await window.api(`/api/sync/status/${jobId}`);
      if (!r || !r.ok) {
        // 404 = expired TTL, 401 = session expired, etc. — stop immediately.
        clearInterval(id);
        onError({ message: r?.error || 'Job not found or expired' });
        return;
      }
      const job = r.job || {};
      onProgress(job);
      if (job.status === 'done') {
        clearInterval(id);
        onDone(job);
      } else if (job.status === 'error') {
        clearInterval(id);
        onError(job);
      } else if (count >= maxPolls) {
        clearInterval(id);
        onError({ message: `Polling timeout after ${count} attempts (${Math.round(count * intervalMs / 1000)}s)` });
      }
    } catch (e) {
      clearInterval(id);
      onError({ message: e.message });
    }
  }, intervalMs);
  return () => clearInterval(id);
};

// ── Status badge ──
const StatusBadge = ({ status }) => {
  const cls = { Completed: 'green', Pending: 'yellow', InProgress: 'blue', Error: 'red' }[status] || 'blue';
  return <span className={`badge badge-${cls}`}>{status}</span>;
};

// ── Match % bar ──
const MatchBar = ({ pct }) => {
  const color = pct >= 90 ? 'var(--green)' : pct >= 70 ? 'var(--yellow)' : 'var(--red)';
  return (
    <span>
      <span className="progress-bar"><span className="progress-fill" style={{ width: `${pct}%`, background: color }} /></span>
      <span style={{ fontSize: 12 }}>{pct}%</span>
    </span>
  );
};

// ── Toast ──
const Toast = ({ message, onClose }) => {
  useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, []);
  return message ? <div className="toast">{message}</div> : null;
};

// ═══════════════════════════════════════════════════
// SimpleProgressModal — polling status from backend
// ═══════════════════════════════════════════════════
const SimpleProgressModal = ({ isOpen, eventCode, onClose }) => {
  const [status, setStatus] = useState(null);
  const [pollingId, setPollingId] = useState(null);

  useEffect(() => {
    if (!isOpen || !eventCode) {
      if (pollingId) clearInterval(pollingId);
      return;
    }

    const poll = setInterval(async () => {
      try {
        const s = await api(`/api/load/${eventCode}/status`);
        setStatus(s);
        if (s.status === 'done' || s.status === 'error') {
          clearInterval(poll);
          setTimeout(onClose, 1000); // Close after 1 sec to show final state
        }
      } catch (e) {
        console.error('Status poll error:', e);
      }
    }, 5000); // Poll every 5 seconds

    setPollingId(poll);
    return () => clearInterval(poll);
  }, [isOpen, eventCode]);

  if (!isOpen || !status || status.status === 'not_found') return null;

  const step = status.step || 'unknown';
  const stepNum = step.includes('step1') ? 1 : step.includes('step2') ? 2 : step.includes('step3') ? 3 : 0;
  const message = status.message || 'Processing...';
  const rowsWritten = status.rows_written || 0;
  const teamsProcessed = status.teams_processed || 0;
  const isDone = status.status === 'done';
  const isError = status.status === 'error';

  return (
    <div className="modal-overlay">
      <div className="modal-content">
        <div className="modal-title">{isDone ? '✅ Done!' : isError ? '❌ Error' : status.status === 'cancelled' ? '🛑 Cancelled' : '⏳ Loading...'}</div>
        <div className="modal-subtitle">{message}</div>

        <div style={{ marginBottom: 20, fontSize: 13, color: 'var(--text2)' }}>
          <div style={{ marginBottom: 8 }}>
            <strong>Step {stepNum}:</strong> {
              stepNum === 1 ? 'Fetching runners' :
              stepNum === 2 ? 'Fetching teams' :
              stepNum === 3 ? 'Backfilling team codes' :
              'Initializing'
            }
          </div>
          {rowsWritten > 0 && <div style={{ marginBottom: 4 }}>📊 Runners: {rowsWritten.toLocaleString()}</div>}
          {teamsProcessed > 0 && <div>👥 Teams processed: {teamsProcessed}</div>}
        </div>

        {!isDone && !isError && (
          <div className="loading-dots">
            <div className="loading-dot" />
            <div className="loading-dot" />
            <div className="loading-dot" />
          </div>
        )}

        {(isDone || isError || status.status === 'cancelled') && (
          <button className="btn btn-primary" onClick={onClose} style={{ width: '100%', marginTop: 16 }}>
            Close
          </button>
        )}
        {!isDone && !isError && status.status !== 'cancelled' && (
          <button className="btn btn-danger" onClick={async () => {
            await api(`/api/load/${eventCode}/cancel`, { method: 'POST' });
          }} style={{ width: '100%', marginTop: 16, background: 'var(--danger, #ef4444)', color: '#fff', border: 'none' }}>
            Cancel
          </button>
        )}
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════
// App shell
// ═══════════════════════════════════════════════════
const App = () => {
  const [view, setView] = useState('loading'); // loading | restricted | dashboard | detail | tables | log | settings | admins | pyexec | pycode
  const [selectedEventId, setSelectedEventId] = useState(null);
  const [userRole, setUserRole] = useState(null);
  const [userEmail, setUserEmail] = useState('');
  const [versionInfo, setVersionInfo] = useState(null);

  const VALID_VIEWS = new Set(['payments','autoguess_log','members','district','audit','reconcile','duplicates','sync','admins','log','pyexec','tables','dashboard','detail','nyrr_queue','nyrr_reconcile','settings','hof']);

  // Hash-based navigation: keeps back/forward and refresh in sync
  const navigate = useCallback((v, replace = false) => {
    setView(v);
    const method = replace ? 'replaceState' : 'pushState';
    history[method](null, '', '#' + v);
  }, []);

  // Back/forward button support
  useEffect(() => {
    const onPop = () => {
      const hash = window.location.hash.slice(1);
      if (VALID_VIEWS.has(hash)) setView(hash);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  useEffect(() => {
    api('/api/version').then(r => {
      if (r.ok) setVersionInfo(r);
    });
    api('/api/me').then(r => {
      if (r.ok && r.data) {
        setUserRole(r.data.role);
        setUserEmail(r.data.email);
        if (r.data.role === 'none') {
          navigate('restricted', true);
        } else {
          // Honour hash on refresh; fall back to payments
          const hash = window.location.hash.slice(1);
          const initial = VALID_VIEWS.has(hash) ? hash : 'payments';
          navigate(initial, true);
        }
      } else if (r.status === 401 || r.status === 403 || r.redirect) {
        window.location = '/login';
      } else {
        navigate('payments', true);
      }
    });
  }, []);

  const selectEvent = (id) => { setSelectedEventId(id); navigate('detail'); };
  const goBack = () => { setSelectedEventId(null); navigate('dashboard'); };

  const handleSignOut = () => {
    window.location = '/logout';
  };

  if (view === 'loading') {
    return (
      <div className="app">
        <div className="loading"><span className="spinner" /> Initializing...</div>
      </div>
    );
  }

  if (view === 'restricted') {
    return (
      <div className="app">
        <div className="access-restricted">
          <div className="access-restricted-box">
            <div className="big">🔒</div>
            <h2>Access Restricted</h2>
            <p>You are signed in as <strong>{userEmail}</strong>.</p>
            <p style={{ marginBottom: 24 }}>To request admin access, please contact <a href="mailto:admin@mmrunners.org">admin@mmrunners.org</a></p>
            <button className="btn btn-primary" onClick={handleSignOut}>Sign out</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="app">
      <div className="header">
        <div>
          <h1>MMR Admin Portal</h1>
          <div className="subtitle">
            Misty Mountain Runners — Event Management & Data Browser
            {versionInfo && versionInfo.commit && (
              <span style={{ marginLeft: 12, opacity: 0.5, fontSize: 11 }}
                    title={versionInfo.deployed_at ? `Deployed: ${new Date(versionInfo.deployed_at).toLocaleString()}` : ''}>
                v{versionInfo.commit}{versionInfo.deployed_at ? ` · ${new Date(versionInfo.deployed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}` : ''}
              </span>
            )}
          </div>
        </div>
        <div className="header-right">
          {userEmail && (
            <div className="user-info">
              <span className="user-email">{userEmail}</span>
              <span className="user-signout" onClick={handleSignOut}>Sign out</span>
            </div>
          )}
          <button
            className="btn btn-outline"
            style={{ height: 'fit-content' }}
            onClick={() => navigate('settings')}
          >
            ⚙️ Settings
          </button>
        </div>
      </div>

      {view !== 'settings' && (
        <>
          {/* Top-level tabs: Payments, Members, Sync, Admins, Data Browser, NYRR Todos */}
          <div className="tabs">
            {(userRole === 'super_admin' || userRole === 'admin') && (
              <button className={`tab ${view === 'payments' || view === 'autoguess_log' ? 'active' : ''}`} onClick={() => navigate('payments')}>Payments</button>
            )}
            {(userRole === 'super_admin' || userRole === 'admin') && (
              <button className={`tab ${['members', 'district', 'audit', 'reconcile', 'duplicates'].includes(view) ? 'active' : ''}`} onClick={() => navigate('members')}>Members</button>
            )}
            {(userRole === 'super_admin' || userRole === 'admin') && (
              <button className={`tab ${view === 'sync' ? 'active' : ''}`} onClick={() => navigate('sync')}>Sync with Google</button>
            )}
            {(userRole === 'super_admin' || userRole === 'admin') && (
              <button className={`tab ${view === 'admins' || view === 'log' || view === 'pyexec' ? 'active' : ''}`} onClick={() => navigate('admins')}>Admins</button>
            )}
            <button className={`tab ${view === 'tables' ? 'active' : ''}`} onClick={() => navigate('tables')}>Data Browser</button>
            <button className={`tab ${['dashboard', 'detail', 'nyrr_queue'].includes(view) ? 'active' : ''}`} onClick={() => navigate('dashboard')}>NYRR Todos</button>
            <button className={`tab ${view === 'hof' ? 'active' : ''}`} onClick={() => navigate('hof')}>🏆 Hall of Fame</button>
          </div>

          {/* NYRR sub-tabs: Todos (dashboard), Match Queue, Reconcile */}
          {['dashboard', 'detail', 'nyrr_queue', 'nyrr_reconcile'].includes(view) ? (
            <div className="tabs" style={{ marginBottom: 16, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
              <button className={`tab ${view === 'dashboard' || view === 'detail' ? 'active' : ''}`} onClick={() => navigate('dashboard')}>📋 Todos</button>
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'nyrr_queue' ? 'active' : ''}`} onClick={() => navigate('nyrr_queue')}>🏃 Match Queue</button>
              )}
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'nyrr_reconcile' ? 'active' : ''}`} onClick={() => navigate('nyrr_reconcile')}>🔄 Reconcile</button>
              )}
            </div>
          ) : null}

          {/* Payments sub-tabs: Payments, Autoguess Log */}
          {view === 'payments' || view === 'autoguess_log' ? (
            <div className="tabs" style={{ marginBottom: 16, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'payments' ? 'active' : ''}`} onClick={() => navigate('payments')}>Payments</button>
              )}
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'autoguess_log' ? 'active' : ''}`} onClick={() => navigate('autoguess_log')}>🤖 Autoguess Log</button>
              )}
            </div>
          ) : null}

          {/* Members sub-tabs */}
          {['members', 'district', 'audit', 'reconcile', 'duplicates'].includes(view) ? (
            <div className="tabs" style={{ marginBottom: 16, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
              <button className={`tab ${view === 'district' ? 'active' : ''}`} onClick={() => navigate('district')}>Members by District</button>
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'members' ? 'active' : ''}`} onClick={() => navigate('members')}>Edit Member</button>
              )}
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'audit' ? 'active' : ''}`} onClick={() => navigate('audit')}>🔍 Renewal Audit</button>
              )}
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'reconcile' ? 'active' : ''}`} onClick={() => navigate('reconcile')}>💳 Reconcile Payments</button>
              )}
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'duplicates' ? 'active' : ''}`} onClick={() => navigate('duplicates')}>🔁 Duplicates</button>
              )}
            </div>
          ) : null}

          {/* Admins sub-tabs: Admins, Sync Log, Python Exec, Data Query */}
          {view === 'admins' || view === 'log' || view === 'pyexec' ? (
            <div className="tabs" style={{ marginBottom: 16, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'admins' ? 'active' : ''}`} onClick={() => navigate('admins')}>Admins</button>
              )}
              <button className={`tab ${view === 'log' ? 'active' : ''}`} onClick={() => navigate('log')}>Sync Log</button>
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'pyexec' ? 'active' : ''}`} onClick={() => navigate('pyexec')}>Python Exec</button>
              )}
              {(userRole === 'super_admin' || userRole === 'admin') && (
                <button className={`tab ${view === 'query' ? 'active' : ''}`} onClick={() => window.location.href = '/query'}>Data Query</button>
              )}
            </div>
          ) : null}
        </>
      )}

      {view === 'dashboard' && window.Dashboard && React.createElement(window.Dashboard, { onSelectEvent: selectEvent, onGoSettings: () => navigate('settings') })}
      {view === 'detail' && selectedEventId && window.EventDetail && React.createElement(window.EventDetail, { eventId: selectedEventId, onBack: goBack })}
      {view === 'payments' && window.PaymentsPanel && React.createElement(window.PaymentsPanel)}
      {view === 'autoguess_log' && window.AutoguessLogPanel && React.createElement(window.AutoguessLogPanel)}
      {view === 'members' && window.MembersPanel && React.createElement(window.MembersPanel)}
      {view === 'district' && window.DistrictMembersPanel && React.createElement(window.DistrictMembersPanel)}
      {view === 'audit' && window.AuditPanel && React.createElement(window.AuditPanel)}
      {view === 'reconcile' && window.ReconcilePanel && React.createElement(window.ReconcilePanel)}
      {view === 'duplicates' && window.MembersDuplicates && React.createElement(window.MembersDuplicates, { onOpenMember: (id) => { navigate('members'); } })}
      {view === 'nyrr_queue' && window.NyrrMatchQueue && React.createElement(window.NyrrMatchQueue)}
      {view === 'nyrr_reconcile' && window.NyrrReconcile && React.createElement(window.NyrrReconcile)}
      {view === 'sync' && window.SyncPanel && React.createElement(window.SyncPanel)}
      {view === 'tables' && window.TableBrowser && React.createElement(window.TableBrowser)}
      {view === 'log' && window.ProcessingLog && React.createElement(window.ProcessingLog)}
      {view === 'admins' && window.AdminPanel && React.createElement(window.AdminPanel, { userRole, userEmail })}
      {view === 'pyexec' && window.PythonExecPanel && React.createElement(window.PythonExecPanel)}
      {view === 'pycode' && window.PythonCodeEditor && React.createElement(window.PythonCodeEditor)}
      {view === 'settings' && window.Settings && React.createElement(window.Settings, { onClose: () => navigate('dashboard') })}
      {view === 'hof' && window.HofPanel && React.createElement(window.HofPanel)}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
