name: NYRR Weekly Sync & Finisher Audit (Tuesday)

on:
  schedule:
    - cron: '0 2 * * 2'  # Every Tuesday at 2:00 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync-nyrr-weekly:
    runs-on: ubuntu-latest
    name: Full NYRR Sync (no batch limit)
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'basecamp/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r basecamp/requirements.txt

      - name: Configure environment
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: |
          # Create .env.local for the sync script
          cat > basecamp/.env.local << EOF
          MYSQL_HOST=$MYSQL_HOST
          MYSQL_USER=$MYSQL_USER
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          MYSQL_DATABASE=$MYSQL_DATABASE
          EOF

      - name: Run finisher count audit (gap analysis)
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          NYRR_API_KEY: ${{ secrets.NYRR_API_KEY }}
        run: |
          python << 'EOF'
          import logging
          import os
          import sys
          sys.path.insert(0, 'mmr-admin')
          from db import get_conn, query
          from nyrr_api import NyrrApiClient

          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
          logger = logging.getLogger(__name__)

          try:
              client = NyrrApiClient()
              rows = query("""
                  SELECT id, event_code, event_name, event_date,
                         nyrr_finisher_count, result_count, processing_status
                  FROM nyrr_events
                  WHERE is_upcoming = 0 AND event_date <= CURDATE()
                    AND (nyrr_finisher_count IS NULL OR nyrr_finisher_count > result_count)
                  ORDER BY event_date DESC LIMIT 50
              """)

              if not rows:
                  logger.info("✓ No events need finisher count audit")
              else:
                  logger.info(f"📊 Auditing {len(rows)} past events...")
                  conn = get_conn()
                  cursor = conn.cursor()
                  updated_count = 0
                  gaps_found = 0

                  for event in rows:
                      event_id, event_code, event_name, _, finisher_count, result_count, status = event
                      try:
                          data = client._post("runners/finishers-filter", {
                              "eventCode": event_code, "pageIndex": 1, "pageSize": 1
                          })
                          total_finishers = data.get("totalItems", 0)
                          if finisher_count != total_finishers:
                              cursor.execute(
                                  "UPDATE nyrr_events SET nyrr_finisher_count = %s WHERE id = %s",
                                  (total_finishers, event_id)
                              )
                              conn.commit()
                              updated_count += 1
                              if result_count < total_finishers:
                                  gap_pct = ((total_finishers - result_count) / total_finishers * 100) if total_finishers > 0 else 0
                                  logger.warning(f"⚠ Gap: {event_code} — NYRR: {total_finishers} | DB: {result_count} ({gap_pct:.1f}% gap)")
                                  gaps_found += 1
                      except Exception as e:
                          logger.error(f"✗ Failed to audit {event_code}: {e}")

                  cursor.close()
                  conn.close()
                  logger.info(f"✅ Audit: {updated_count} updated, {gaps_found} gaps found")

          except Exception as e:
              logger.error(f"❌ Audit failed: {e}")
          EOF

      - name: Run NYRR weekly full sync
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: |
          python basecamp/ops/sync_nyrr_events.py \
            --mode weekly \
            --triggered-by "System" \
            2>&1 | tee sync-nyrr-weekly.log

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nyrr-weekly-sync-logs
          path: sync-nyrr-weekly.log
          retention-days: 30

      - name: Send failure notification (GAS webhook)
        if: failure()
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          curl -X POST "$GAS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "action": "email_send",
              "to": "${{ secrets.NOTIFICATION_EMAIL }}",
              "subject": "❌ NYRR Weekly Sync Failed",
              "html_content": "<h2>Workflow Failed</h2><p>Weekly NYRR Sync & Finisher Audit (Tuesday) did not complete successfully.</p><p><strong>Run:</strong> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View in GitHub</a></p><p><strong>Branch:</strong> ${{ github.ref }}<br><strong>Commit:</strong> ${{ github.sha }}</p><p>Check the logs for details.</p>",
              "cc": "admin@mmrunners.org",
              "email_type": "github_action_failure"
            }'

  verify:
    runs-on: ubuntu-latest
    name: Verify NYRR sync status
    if: success()
    needs: sync-nyrr-weekly
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python

      - name: Check MySQL NYRR row counts
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: |
          python << 'EOF'
          import mysql.connector
          import os
          from datetime import datetime

          try:
              conn = mysql.connector.connect(
                  host=os.environ.get('MYSQL_HOST'),
                  user=os.environ.get('MYSQL_USER'),
                  password=os.environ.get('MYSQL_PASSWORD'),
                  database=os.environ.get('MYSQL_DATABASE'),
                  ssl_disabled=False
              )
              cursor = conn.cursor()

              # Check nyrr_events
              cursor.execute("SELECT COUNT(*) FROM nyrr_events")
              events_count = cursor.fetchone()[0]
              print(f"✓ NYRR Events in MySQL: {events_count}")

              # Check nyrr_event_runners
              cursor.execute("SELECT COUNT(*) FROM nyrr_event_runners")
              runners_count = cursor.fetchone()[0]
              print(f"✓ NYRR Event Runners in MySQL: {runners_count}")

              # Check matched vs unmatched
              cursor.execute("""
                  SELECT
                      COUNT(*) AS total,
                      SUM(CASE WHEN mmr_member_id IS NOT NULL THEN 1 ELSE 0 END) AS matched,
                      SUM(CASE WHEN mmr_member_id IS NULL AND team_code = 'MMR' THEN 1 ELSE 0 END) AS unmatched_mmr
                  FROM nyrr_event_runners
              """)
              row = cursor.fetchone()
              print(f"✓ Total runners: {row[0]} | Matched: {row[1]} | Unmatched MMR: {row[2]}")

              # Check pending events remaining
              cursor.execute("""
                  SELECT COUNT(*) FROM nyrr_events WHERE processing_status = 'Pending'
              """)
              pending_count = cursor.fetchone()[0]
              print(f"✓ Remaining pending events: {pending_count}")

              # Processing log summary for this run
              cursor.execute("""
                  SELECT run_status, COUNT(*) AS cnt, SUM(rows_written) AS total_rows
                  FROM nyrr_processing_log
                  WHERE run_timestamp >= DATE_SUB(NOW(), INTERVAL 4 HOUR)
                  GROUP BY run_status
              """)
              log_rows = cursor.fetchall()
              for status, cnt, total_rows in log_rows:
                  print(f"✓ Processing log (last 4h): {status} = {cnt} runs, {total_rows} rows")

              # Events in error state
              cursor.execute("""
                  SELECT COUNT(*) FROM nyrr_events WHERE processing_status = 'Error'
              """)
              error_count = cursor.fetchone()[0]
              if error_count > 0:
                  print(f"⚠ Events in Error state: {error_count}")

              # Match coverage
              cursor.execute("""
                  SELECT
                      COUNT(DISTINCT nyrr_event_id) AS events_with_runners,
                      ROUND(
                          SUM(CASE WHEN mmr_member_id IS NOT NULL THEN 1 ELSE 0 END) * 100.0
                          / NULLIF(SUM(CASE WHEN team_code = 'MMR' THEN 1 ELSE 0 END), 0),
                          1
                      ) AS match_pct
                  FROM nyrr_event_runners
              """)
              coverage = cursor.fetchone()
              print(f"✓ Events with runners: {coverage[0]} | MMR match rate: {coverage[1]}%")

              cursor.close()
              conn.close()

          except Exception as e:
              print(f"✗ Verification failed: {e}")
              exit(1)
          EOF

      - name: Send success notification (GAS webhook)
        if: success()
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          curl -X POST "$GAS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "action": "email_send",
              "to": "${{ secrets.NOTIFICATION_EMAIL }}",
              "subject": "✓ NYRR Weekly Sync Completed Successfully",
              "html_content": "<h2>Workflow Completed</h2><p>Weekly NYRR Sync & Finisher Audit (Tuesday) finished successfully.</p><p><strong>Run:</strong> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View in GitHub</a></p><p><strong>Branch:</strong> ${{ github.ref }}<br><strong>Commit:</strong> ${{ github.sha }}</p>",
              "cc": "admin@mmrunners.org",
              "email_type": "github_action_success"
            }'
