name: Deploy MMR Admin to Azure App Service

on:
  # DISABLED for April. 
  # push:
  #  branches:
  #    - main
  #  paths:
  #    - 'mmr-admin/**'
  #    - 'basecamp/python/**'
  #    - '.github/workflows/deploy-mmr-admin.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v3

      - name: Copy shared Python modules into deploy package
        run: ./scripts/sync-shared-modules.sh

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and validate imports
        run: |
          cd mmr-admin
          pip install -r requirements.txt --quiet
          python3 test_imports.py

      - name: Write VERSION file with git SHA and deploy timestamp
        run: |
          echo "{\"commit\": \"$(git rev-parse --short HEAD)\", \"deployed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > mmr-admin/VERSION

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: mmr-nyrr-viewer
          package: mmr-admin
