name: Deploy MMR Admin to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'mmr-admin/**'
      - 'basecamp/python/**'
      - '.github/workflows/deploy-mmr-admin.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v3

      - name: Copy shared nyrr_api module into deploy package
        run: cp basecamp/python/nyrr_api.py mmr-admin/nyrr_api.py

      - name: Write VERSION file with git SHA and deploy timestamp
        run: |
          echo "{\"commit\": \"$(git rev-parse --short HEAD)\", \"deployed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > mmr-admin/VERSION

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: mmr-nyrr-viewer
          package: mmr-admin
