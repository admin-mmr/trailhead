name: DB - 🔍 SQL Procedure Lint

on:
  push:
    branches: [main]
    paths: ['db/**']
  pull_request:
    branches: [main]
    paths: ['db/**']
  workflow_dispatch:

jobs:
  sql-lint:
    runs-on: ubuntu-latest
    name: Check SQL procedures for ENUM safety issues
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run ENUM safety test
        run: python3 db/test_procedure_enum_safety.py

      - name: Run with pytest (verbose on failure)
        if: failure()
        run: |
          pip install pytest --quiet
          python3 -m pytest db/test_procedure_enum_safety.py -v
