name: Full Bidirectional Sync

on:
  # disabled 
  # schedule:
  #  - cron: '0 2,8,14,20 * * *'   # 02:00 / 08:00 / 14:00 / 20:00 UTC
  workflow_dispatch:               # Manual trigger from GitHub UI
    inputs:
      verbose:
        description: 'Enable verbose logging (shows sample rows and diffs)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  ADMIN_URL:     ${{ secrets.MMR_ADMIN_URL }}    # https://mmr-admin.azurewebsites.net
  CRON_TOKEN:    ${{ secrets.SYNC_CRON_TOKEN }}  # shared secret, set in Azure App Settings too
  POLL_INTERVAL: 5
  POLL_TIMEOUT:  300
  VERBOSE:       ${{ inputs.verbose || 'false' }}

# Each phase job:
#   1. checks out the repo (so the shared poll script is available)
#   2. runs .github/scripts/run_sync_phase.sh <endpoint>
#   3. exports status + summary outputs for the final notify job
#
# All phases use "if: always()" so later phases still run after earlier failures.

jobs:

  p1-members-mysql-to-google:
    name: "1/8 · Members: MySQL → Google"
    runs-on: ubuntu-latest
    outputs:
      status:  ${{ steps.run.outputs.status }}
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Run & poll
        id: run
        run: bash .github/scripts/run_sync_phase.sh /api/sync/mysql-to-google/members ${{ env.VERBOSE == 'true' && '--verbose' || '' }}

  p2-members-google-to-mysql:
    name: "2/8 · Members: Google → MySQL"
    needs: p1-members-mysql-to-google
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status:  ${{ steps.run.outputs.status }}
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Run & poll
        id: run
        run: bash .github/scripts/run_sync_phase.sh /api/sync/google-to-mysql/members ${{ env.VERBOSE == 'true' && '--verbose' || '' }}

  p3-events-mysql-to-google:
    name: "3/8 · Events: MySQL → Google"
    needs: p2-members-google-to-mysql
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status:  ${{ steps.run.outputs.status }}
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Run & poll
        id: run
        run: bash .github/scripts/run_sync_phase.sh /api/sync/mysql-to-google/events ${{ env.VERBOSE == 'true' && '--verbose' || '' }}

  p4-events-google-to-mysql:
    name: "4/8 · Events: Google → MySQL"
    needs: p3-events-mysql-to-google
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status:  ${{ steps.run.outputs.status }}
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Run & poll
        id: run
        run: bash .github/scripts/run_sync_phase.sh /api/sync/google-to-mysql/events ${{ env.VERBOSE == 'true' && '--verbose' || '' }}

  p5-payments-mysql-to-google:
    name: "5/8 · Payments: MySQL → Google"
    needs: p4-events-google-to-mysql
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status:  ${{ steps.run.outputs.status }}
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Run & poll
        id: run
        run: bash .github/scripts/run_sync_phase.sh /api/sync/mysql-to-google/payments ${{ env.VERBOSE == 'true' && '--verbose' || '' }}

  p6-payments-google-to-mysql:
    name: "6/8 · Payments: Google → MySQL"
    needs: p5-payments-mysql-to-google
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status:  ${{ steps.run.outputs.status }}
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Run & poll
        id: run
        run: bash .github/scripts/run_sync_phase.sh /api/sync/google-to-mysql/payments ${{ env.VERBOSE == 'true' && '--verbose' || '' }}

  p7-import-gmail-transactions:
    name: "7/8 · Gmail Transactions: Import to MySQL"
    needs: p6-payments-google-to-mysql
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status:  ${{ steps.run.outputs.status }}
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Run & poll
        id: run
        run: bash .github/scripts/run_sync_phase.sh /api/sync/import-transactions ${{ env.VERBOSE == 'true' && '--verbose' || '' }}

  p8-sync-unprocessed-txns:
    name: "8/8 · Unprocessed Txns: MySQL → Google"
    needs: p7-import-gmail-transactions
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status:  ${{ steps.run.outputs.status }}
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Run & poll
        id: run
        run: bash .github/scripts/run_sync_phase.sh /api/sync/unprocessed-transactions ${{ env.VERBOSE == 'true' && '--verbose' || '' }}

  # ── Final summary email ──────────────────────────────────────────────────
  notify:
    name: "Summary Email → admin@mmrunners.org"
    needs:
      - p1-members-mysql-to-google
      - p2-members-google-to-mysql
      - p3-events-mysql-to-google
      - p4-events-google-to-mysql
      - p5-payments-mysql-to-google
      - p6-payments-google-to-mysql
      - p7-import-gmail-transactions
      - p8-sync-unprocessed-txns
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build report
        id: report
        run: |
          icon() { [ "$1" = "done" ] && echo "✅" || echo "❌"; }

          P1="${{ needs.p1-members-mysql-to-google.outputs.status }}"
          P2="${{ needs.p2-members-google-to-mysql.outputs.status }}"
          P3="${{ needs.p3-events-mysql-to-google.outputs.status }}"
          P4="${{ needs.p4-events-google-to-mysql.outputs.status }}"
          P5="${{ needs.p5-payments-mysql-to-google.outputs.status }}"
          P6="${{ needs.p6-payments-google-to-mysql.outputs.status }}"
          P7="${{ needs.p7-import-gmail-transactions.outputs.status }}"
          P8="${{ needs.p8-sync-unprocessed-txns.outputs.status }}"

          ALL_OK=true
          for S in $P1 $P2 $P3 $P4 $P5 $P6 $P7 $P8; do
            [ "$S" != "done" ] && ALL_OK=false
          done

          $ALL_OK \
            && echo "subject=✅ Full Sync OK — $(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT" \
            || echo "subject=⚠️ Full Sync ERRORS — $(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "Full Bidirectional Sync — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "$(icon $P1) 1/8  Members: MySQL → Google     [$P1]  ${{ needs.p1-members-mysql-to-google.outputs.summary }}"
            echo "$(icon $P2) 2/8  Members: Google → MySQL     [$P2]  ${{ needs.p2-members-google-to-mysql.outputs.summary }}"
            echo "$(icon $P3) 3/8  Events:  MySQL → Google     [$P3]  ${{ needs.p3-events-mysql-to-google.outputs.summary }}"
            echo "$(icon $P4) 4/8  Events:  Google → MySQL     [$P4]  ${{ needs.p4-events-google-to-mysql.outputs.summary }}"
            echo "$(icon $P5) 5/8  Payments: MySQL → Google    [$P5]  ${{ needs.p5-payments-mysql-to-google.outputs.summary }}"
            echo "$(icon $P6) 6/8  Payments: Google → MySQL    [$P6]  ${{ needs.p6-payments-google-to-mysql.outputs.summary }}"
            echo "$(icon $P7) 7/8  Gmail Txns: Import          [$P7]  ${{ needs.p7-import-gmail-transactions.outputs.summary }}"
            echo "$(icon $P8) 8/8  Unprocessed Txns: → Google  [$P8]  ${{ needs.p8-sync-unprocessed-txns.outputs.summary }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port:    ${{ secrets.MAIL_PORT }}
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          subject:        ${{ steps.report.outputs.subject }}
          to:             admin@mmrunners.org
          from:           "MMR Sync <${{ secrets.MAIL_USERNAME }}>"
          body:           ${{ steps.report.outputs.body }}
