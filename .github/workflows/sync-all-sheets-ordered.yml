name: Sync All Sheets (Ordered Sequential)

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
    # Also run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  # Google Sheets IDs
  SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_MEMBERSHIP_ID }}
  GMAIL_TRANSACTION_SHEET_ID: ${{ secrets.GMAIL_TRANSACTION_SHEET_ID }}
  GOOGLE_SHEETS_PAYMENTS_ID: ${{ secrets.GOOGLE_SHEETS_PAYMENTS_ID }}
  GOOGLE_SHEETS_WEBAPP_EVENTS_ID: ${{ secrets.GOOGLE_SHEETS_WEBAPP_EVENTS_ID }}

  # Google Credentials
  GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

  # MySQL Database (build DATABASE_URL from individual secrets)
  MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
  MYSQL_USER: ${{ secrets.MYSQL_USER }}
  MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
  MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
  DATABASE_URL: mysql://${{ secrets.MYSQL_USER }}:${{ secrets.MYSQL_PASSWORD }}@${{ secrets.MYSQL_HOST }}:3306/${{ secrets.MYSQL_DATABASE }}?ssl=true

  # Azure & Email
  AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
  MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
  MAIL_PORT: ${{ secrets.MAIL_PORT }}
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
  NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

jobs:
  # Step 1: Sync Active sheet (gmail_transactions)
  # Must run first - no dependencies
  sync-active:
    name: "Sync 1/4 - Active (gmail_transactions)"
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
      timestamp: ${{ steps.timestamp.outputs.time }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q mysql-connector-python google-auth-httplib2 google-api-python-client google-auth-oauthlib azure-storage-blob python-dotenv

      - name: Get timestamp
        id: timestamp
        run: echo "time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Sync Active sheet to gmail_transactions table
        id: sync-active
        run: |
          cd basecamp
          python3 ops/sync_sheets_to_mysql.py \
            --sheet "Active" \
            --table "gmail_transactions" \
            --spreadsheet-id "$GMAIL_TRANSACTION_SHEET_ID" \
            --key-field "MessageId"
        continue-on-error: true

      - name: Report results
        run: |
          echo "Sync Active completed with status: ${{ steps.sync-active.outcome }}"
          if [ "${{ steps.sync-active.outcome }}" = "success" ]; then
            echo "✅ Active sync successful"
          else
            echo "⚠️ Active sync failed - checking details..."
          fi

  # Step 2: Sync Payment-History sheet (payments)
  # Waits for sync-active to complete
  sync-payments:
    name: "Sync 2/4 - Payment-History (payments)"
    needs: sync-active
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q mysql-connector-python google-auth-httplib2 google-api-python-client google-auth-oauthlib azure-storage-blob python-dotenv

      - name: Sync Payment-History sheet to payments table
        id: sync-payments
        run: |
          cd basecamp
          python3 ops/sync_sheets_to_mysql.py \
            --sheet "Payment-History" \
            --table "payments" \
            --spreadsheet-id "$SPREADSHEET_ID" \
            --key-field "PaymentID"
        continue-on-error: true

      - name: Report results
        run: |
          echo "Sync Payment-History completed with status: ${{ steps.sync-payments.outcome }}"
          if [ "${{ steps.sync-payments.outcome }}" = "success" ]; then
            echo "✅ Payments sync successful"
          else
            echo "⚠️ Payments sync failed"
          fi

  # Step 3: Sync WebApp-Events sheet (webapp_events)
  # Waits for sync-payments to complete
  # This depends on gmail_transactions existing (from sync-active)
  sync-events:
    name: "Sync 3/4 - WebApp-Events (webapp_events)"
    needs: sync-payments
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q mysql-connector-python google-auth-httplib2 google-api-python-client google-auth-oauthlib azure-storage-blob python-dotenv

      - name: Sync WebApp-Events sheet to webapp_events table
        id: sync-events
        run: |
          cd basecamp
          python3 ops/sync_sheets_to_mysql.py \
            --sheet "WebApp-Events" \
            --table "webapp_events" \
            --spreadsheet-id "$SPREADSHEET_ID" \
            --key-field "EventID"
        continue-on-error: true

      - name: Report results
        run: |
          echo "Sync WebApp-Events completed with status: ${{ steps.sync-events.outcome }}"
          if [ "${{ steps.sync-events.outcome }}" = "success" ]; then
            echo "✅ Events sync successful"
          else
            echo "⚠️ Events sync failed"
          fi

  # Step 4: Sync Main sheet (members)
  # Waits for sync-events to complete
  sync-members:
    name: "Sync 4/4 - Main (members)"
    needs: sync-events
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q mysql-connector-python google-auth-httplib2 google-api-python-client google-auth-oauthlib azure-storage-blob python-dotenv

      - name: Sync Main sheet to members table
        id: sync-members
        run: |
          cd basecamp
          python3 ops/sync_sheets_to_mysql.py \
            --sheet "Main" \
            --table "members" \
            --spreadsheet-id "$SPREADSHEET_ID" \
            --key-field "Email"
        continue-on-error: true

      - name: Report results
        run: |
          echo "Sync Main completed with status: ${{ steps.sync-members.outcome }}"
          if [ "${{ steps.sync-members.outcome }}" = "success" ]; then
            echo "✅ Members sync successful"
          else
            echo "⚠️ Members sync failed"
          fi

  # Final notification
  notify:
    name: "Send Notification"
    needs: [sync-active, sync-payments, sync-events, sync-members]
    runs-on: ubuntu-latest
    if: always()  # Run even if previous jobs fail

    steps:
      - name: Determine overall status
        id: status
        run: |
          ACTIVE_STATUS="${{ needs.sync-active.outputs.status }}"
          PAYMENTS_STATUS="${{ needs.sync-payments.outputs.status }}"
          EVENTS_STATUS="${{ needs.sync-events.outputs.status }}"
          MEMBERS_STATUS="${{ needs.sync-members.outputs.status }}"

          echo "Active: $ACTIVE_STATUS"
          echo "Payments: $PAYMENTS_STATUS"
          echo "Events: $EVENTS_STATUS"
          echo "Members: $MEMBERS_STATUS"

          if [ "$ACTIVE_STATUS" = "success" ] && [ "$PAYMENTS_STATUS" = "success" ] && [ "$EVENTS_STATUS" = "success" ] && [ "$MEMBERS_STATUS" = "success" ]; then
            echo "overall=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "message=All syncs completed successfully" >> $GITHUB_OUTPUT
          else
            echo "overall=failure" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
            echo "message=Some syncs failed - check logs" >> $GITHUB_OUTPUT
          fi

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "${{ steps.status.outputs.emoji }} Sync Report - ${{ steps.status.outputs.overall }}"
          to: ${{ env.NOTIFICATION_EMAIL }}
          from: "MMR Sync Bot <${{ env.SMTP_USERNAME }}>"
          body: |
            Sync Run Report
            ===============

            Timestamp: ${{ needs.sync-active.outputs.timestamp }}
            Overall Status: ${{ steps.status.outputs.overall }}

            Sync Results:
            • Active (gmail_transactions): ${{ needs.sync-active.outputs.status }}
            • Payment-History (payments): ${{ needs.sync-payments.outputs.status }}
            • WebApp-Events (webapp_events): ${{ needs.sync-events.outputs.status }}
            • Main (members): ${{ needs.sync-members.outputs.status }}

            Details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ${{ steps.status.outputs.message }}
