name: Create V10 Audit Triggers

on:
  workflow_dispatch:
    inputs:
      audit_only:
        description: 'Create only audit triggers (trg_members_after_*)?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  create-triggers:
    name: Create V10 Audit Triggers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Create V10 Audit Triggers
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: |
          echo "🔧 Creating V10 audit triggers (trg_members_after_insert/update)..."
          mysql -h "$MYSQL_HOST" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" <<'EOF'
          -- Drop existing triggers if they exist
          DROP TRIGGER IF EXISTS trg_members_after_insert;
          DROP TRIGGER IF EXISTS trg_members_after_update;

          DELIMITER $$
          -- Create audit triggers with V10 column names
          -- These log member changes to member_log table
          -- Uses: LastLogin (not LastLoginDate), no WebApp/PaymentCheck columns

          CREATE TRIGGER trg_members_after_insert
          AFTER INSERT ON members
          FOR EACH ROW
          BEGIN
            INSERT INTO member_log (
              LogID, LoggingTime, MemberID, ChangeType, Status, Created, Expiration,
              Email, FirstName, LastName, Type, FamilyID, Gender, WeChatID, District,
              Info, LastUpdated, MembershipFeePaid, PaymentDate, PaymentTransaction,
              JoinYear, PhoneNumber, LastLogin, Notes, NYRRRunnerName, YearBorn
            )
            VALUES (
              CONCAT('ML-', UNIX_TIMESTAMP(NOW(3)) * 1000, '-', FLOOR(RAND() * 10000)),
              NOW(),
              NEW.MemberID, 'INSERT', NEW.Status, NEW.Created, NEW.Expiration,
              NEW.Email, NEW.FirstName, NEW.LastName, NEW.Type, NEW.FamilyID,
              NEW.Gender, NEW.WeChatID, NEW.District,
              NEW.Info, NEW.LastUpdated, NEW.MembershipFeePaid, NEW.PaymentDate,
              NEW.PaymentTransaction, NEW.JoinYear, NEW.PhoneNumber, NEW.LastLogin,
              NEW.Notes, NEW.NYRRRunnerName, NEW.YearBorn
            );
          END$$

          CREATE TRIGGER trg_members_after_update
          AFTER UPDATE ON members
          FOR EACH ROW
          BEGIN
            INSERT INTO member_log (
              LogID, LoggingTime, MemberID, ChangeType, Status, Created, Expiration,
              Email, FirstName, LastName, Type, FamilyID, Gender, WeChatID, District,
              Info, LastUpdated, MembershipFeePaid, PaymentDate, PaymentTransaction,
              JoinYear, PhoneNumber, LastLogin, Notes, NYRRRunnerName, YearBorn
            )
            VALUES (
              CONCAT('ML-', UNIX_TIMESTAMP(NOW(3)) * 1000, '-', FLOOR(RAND() * 10000)),
              NOW(),
              NEW.MemberID, 'UPDATE', NEW.Status, NEW.Created, NEW.Expiration,
              NEW.Email, NEW.FirstName, NEW.LastName, NEW.Type, NEW.FamilyID,
              NEW.Gender, NEW.WeChatID, NEW.District,
              NEW.Info, NEW.LastUpdated, NEW.MembershipFeePaid, NEW.PaymentDate,
              NEW.PaymentTransaction, NEW.JoinYear, NEW.PhoneNumber, NEW.LastLogin,
              NEW.Notes, NEW.NYRRRunnerName, NEW.YearBorn
            );
          END$$

          DELIMITER ;

          SELECT 'TRIGGER trg_members_after_insert' AS created;
          SELECT 'TRIGGER trg_members_after_update' AS created;
          EOF

          echo ""
          echo "✅ V10 audit triggers created successfully"

      - name: Verify Triggers
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: |
          echo ""
          echo "📋 Current triggers on members table:"
          mysql -h "$MYSQL_HOST" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" <<'EOF'
          SELECT TRIGGER_NAME
          FROM INFORMATION_SCHEMA.TRIGGERS
          WHERE TRIGGER_SCHEMA = DATABASE() AND EVENT_OBJECT_TABLE = 'members'
          ORDER BY TRIGGER_NAME;
          EOF
