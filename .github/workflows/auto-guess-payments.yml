name: Auto-Guess Payment Matching

on:
  # Run after sheets sync completes (picks up fresh gmail_transactions + members)
  workflow_run:
    workflows: ["Sync All Sheets (Ordered Sequential)"]
    types: [completed]
    branches: [main]

  # Manual trigger with optional date overrides
  workflow_dispatch:
    inputs:
      collection_start:
        description: 'Collection window start (YYYY-MM-DD), leave empty to use env default'
        required: false
      collection_end:
        description: 'Collection window end (YYYY-MM-DD), leave empty to use env default'
        required: false
      dry_run:
        description: 'Dry run (true = no DB changes, false = commit)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  # MySQL
  MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
  MYSQL_USER: ${{ secrets.MYSQL_USER }}
  MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
  MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}

  # Auto-guess config (set these in repo secrets or variables)
  MEMBERSHIP_COLLECTION_START: ${{ vars.MEMBERSHIP_COLLECTION_START || '' }}
  MEMBERSHIP_COLLECTION_END: ${{ vars.MEMBERSHIP_COLLECTION_END || '' }}
  MEMBERSHIP_YEAR_END: ${{ vars.MEMBERSHIP_YEAR_END || '' }}
  MEMBERSHIP_RENEWAL_YEARS: ${{ vars.MEMBERSHIP_RENEWAL_YEARS || '1' }}
  INDIVIDUAL_PRICE: ${{ vars.INDIVIDUAL_PRICE || '30' }}
  FAMILY_PRICE: ${{ vars.FAMILY_PRICE || '50' }}

  # Email notification
  MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
  MAIL_PORT: ${{ secrets.MAIL_PORT }}
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
  NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

jobs:
  auto-guess:
    name: "Auto-Guess Payments"
    runs-on: ubuntu-latest
    # Only run on workflow_run if the triggering workflow succeeded
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q mysql-connector-python

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            START="${{ github.event.inputs.collection_start }}"
            END="${{ github.event.inputs.collection_end }}"
          else
            # Automatic run after sheets sync — always commit
            DRY_RUN="false"
            START=""
            END=""
          fi
          echo "dry_run=${DRY_RUN}" >> $GITHUB_OUTPUT
          echo "start=${START}" >> $GITHUB_OUTPUT
          echo "end=${END}" >> $GITHUB_OUTPUT
          echo "Mode: dry_run=${DRY_RUN}, start=${START:-env}, end=${END:-env}"

      - name: Run Auto-Guess
        id: autoguess
        run: |
          cd basecamp
          ARGS=""
          if [ "${{ steps.mode.outputs.dry_run }}" != "true" ]; then
            ARGS="--commit"
          fi
          if [ -n "${{ steps.mode.outputs.start }}" ]; then
            ARGS="$ARGS --start ${{ steps.mode.outputs.start }}"
          fi
          if [ -n "${{ steps.mode.outputs.end }}" ]; then
            ARGS="$ARGS --end ${{ steps.mode.outputs.end }}"
          fi
          echo "Running: python3 ops/auto_guess_payments.py $ARGS"
          python3 ops/auto_guess_payments.py $ARGS 2>&1 | tee /tmp/autoguess_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Send notification
        if: steps.mode.outputs.dry_run != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.MAIL_SERVER }}
          server_port: ${{ env.MAIL_PORT }}
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          subject: "🤖 Auto-Guess Payment Matching — ${{ steps.autoguess.outputs.exit_code == '0' && '✅ Success' || '⚠️ Errors' }}"
          to: ${{ env.NOTIFICATION_EMAIL }}
          from: "MMR Auto-Guess <${{ env.MAIL_USERNAME }}>"
          body: |
            Auto-Guess Payment Matching Report
            ===================================

            Trigger: ${{ github.event_name }}
            Timestamp: ${{ github.event.head_commit.timestamp || 'N/A' }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Output:
            ${{ steps.autoguess.outputs.exit_code == '0' && '✅ Completed successfully' || '⚠️ Completed with errors' }}

            See full output in the GitHub Actions log.
        continue-on-error: true

      - name: Check result
        run: |
          if [ "${{ steps.autoguess.outputs.exit_code }}" != "0" ]; then
            echo "Auto-guess completed with errors"
            exit 1
          fi
          echo "Auto-guess completed successfully"
