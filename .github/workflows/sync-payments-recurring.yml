name: 💳 Recurring Payments Sync (Every 6 Hours)

on:
  # Schedule disabled — superseded by sync-all-sheets-ordered.yml
  # schedule:
  #   - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:  # Manual trigger only

jobs:
  sync-payments:
    runs-on: ubuntu-latest
    name: Sync Payments from Google Sheets
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'basecamp/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r basecamp/requirements.txt

      - name: Configure environment
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_PAYMENTS_ID }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          # Create .env.local for the sync script
          cat > basecamp/.env.local << EOF
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/google-creds.json
          GOOGLE_SHEETS_ID=$GOOGLE_SHEETS_ID
          MYSQL_HOST=$MYSQL_HOST
          MYSQL_USER=$MYSQL_USER
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          MYSQL_DATABASE=$MYSQL_DATABASE
          AZURE_STORAGE_CONNECTION_STRING=$AZURE_STORAGE_CONNECTION_STRING
          EOF

          # Write service account JSON to temp file
          echo "$GOOGLE_SERVICE_ACCOUNT" > /tmp/google-creds.json

      - name: Run Payments sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google-creds.json
        run: |
          python basecamp/ops/sync_sheets_to_mysql.py \
            --sheet "Payment-History" \
            --table "payments" \
            --spreadsheet-id "${{ secrets.GOOGLE_SHEETS_PAYMENTS_ID }}" \
            --sheet-range "Payment-History!A:Z" \
            --key-field "PaymentID" \
            2>&1 | tee sync-payments.log

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payments-sync-logs
          path: sync-payments.log
          retention-days: 30

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '❌ Payments Sync Failed - GitHub Actions'
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          cc: 'admin@mmrunners.org'
          from: 'GitHub Actions <noreply@github.com>'
          body: |
            Workflow: Recurring Payments Sync
            Status: FAILED
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Time: ${{ github.event.repository.updated_at }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}

            Sheet: Payment-History
            Check the logs for details.

      - name: Send success notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '✓ Payments Sync Completed Successfully'
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          cc: 'admin@mmrunners.org'
          from: 'GitHub Actions <noreply@github.com>'
          body: |
            Workflow: Recurring Payments Sync
            Status: SUCCESS
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Time: ${{ github.event.repository.updated_at }}
