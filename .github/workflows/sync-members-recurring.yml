name: 📊 Recurring Members Sync (Every 6 Hours)

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync-members:
    runs-on: ubuntu-latest
    name: Sync Members from Google Sheets
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r basecamp/requirements.txt

      - name: Configure environment
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_MEMBERSHIP_ID }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          # Create .env.local for the sync script
          cat > basecamp/.env.local << EOF
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/google-creds.json
          GOOGLE_SHEETS_ID=$GOOGLE_SHEETS_ID
          MYSQL_HOST=$MYSQL_HOST
          MYSQL_USER=$MYSQL_USER
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          MYSQL_DATABASE=$MYSQL_DATABASE
          AZURE_STORAGE_CONNECTION_STRING=$AZURE_STORAGE_CONNECTION_STRING
          EOF

          # Write service account JSON to temp file
          echo "$GOOGLE_SERVICE_ACCOUNT" > /tmp/google-creds.json

      - name: Run Members sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google-creds.json
        run: |
          python basecamp/ops/sync_sheets_to_mysql.py \
            --sheet "Main" \
            --spreadsheet-id "${{ secrets.GOOGLE_SHEETS_MEMBERSHIP_ID }}" \
            --sheet-range "Main!A:Z" \
            --key-field "Email" \
            2>&1 | tee sync-members.log

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: members-sync-logs
          path: sync-members.log
          retention-days: 30

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '❌ Members Sync Failed - GitHub Actions'
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: 'GitHub Actions <noreply@github.com>'
          body: |
            Workflow: Recurring Members Sync
            Status: FAILED
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Time: ${{ github.event.head_commit.timestamp }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}

            Check the logs for details.

  verify:
    runs-on: ubuntu-latest
    name: Verify sync status
    if: success()
    needs: sync-members
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python

      - name: Check MySQL member count
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: |
          python << 'EOF'
          import mysql.connector
          import os
          from datetime import datetime

          try:
              conn = mysql.connector.connect(
                  host=os.environ.get('MYSQL_HOST'),
                  user=os.environ.get('MYSQL_USER'),
                  password=os.environ.get('MYSQL_PASSWORD'),
                  database=os.environ.get('MYSQL_DATABASE'),
                  ssl_disabled=False
              )
              cursor = conn.cursor()
              cursor.execute("SELECT COUNT(*) FROM members")
              count = cursor.fetchone()[0]
              print(f"✓ Members in MySQL: {count}")
              cursor.close()
              conn.close()
          except Exception as e:
              print(f"✗ Verification failed: {e}")
              exit(1)
          EOF

      - name: Send success notification (optional)
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '✓ Members Sync Completed Successfully'
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: 'GitHub Actions <noreply@github.com>'
          body: |
            Workflow: Recurring Members Sync
            Status: SUCCESS
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Time: ${{ github.event.head_commit.timestamp }}
