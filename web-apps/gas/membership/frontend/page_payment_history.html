<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment History — Misty Mountain Runners</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5; min-height: 100vh; padding: 24px 16px;
    }
    .card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 28px 24px; max-width: 640px; margin: 0 auto;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: #2d7d46; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; background: none;
      padding: 0; margin-bottom: 0; text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    h2 { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
    .member-id { font-size: 13px; color: #888; margin-bottom: 24px; }

    /* Section headers */
    .section-title {
      font-size: 13px; font-weight: 700; color: #555;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin: 24px 0 12px;
    }

    /* Event / payment rows */
    .row-card {
      border: 1px solid #eee; border-radius: 10px;
      padding: 14px 16px; margin-bottom: 10px;
    }
    .row-card:last-child { margin-bottom: 0; }
    .row-top {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 8px;
    }
    .row-intent {
      font-size: 14px; font-weight: 600; color: #1a1a1a;
    }
    .row-amount {
      font-size: 14px; font-weight: 700; color: #2d7d46;
      white-space: nowrap;
    }
    .row-meta {
      font-size: 12px; color: #888; margin-top: 5px;
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .row-meta span::before { content: '· '; }
    .row-meta span:first-child::before { content: ''; }

    /* Status badges */
    .badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px; white-space: nowrap;
    }
    .badge-approved  { background: #e8f5e9; color: #2d7d46; }
    .badge-pending   { background: #fff8e1; color: #f57c00; }
    .badge-matched   { background: #e3f2fd; color: #1565c0; }
    .badge-rejected  { background: #fdecea; color: #c62828; }
    .badge-error     { background: #fdecea; color: #c62828; }

    /* Period bar for confirmed payments */
    .period-bar {
      margin-top: 8px; font-size: 12px; color: #555;
      background: #f0f8f2; border-radius: 6px;
      padding: 6px 10px;
    }

    /* Pending explanation box */
    .pending-explainer {
      background: #fff8e1; border: 1px solid #ffe082;
      border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
      font-size: 13px; color: #5d4037; line-height: 1.6;
    }
    .pending-explainer strong { color: #e65100; }

    .empty { text-align: center; color: #aaa; font-size: 14px; padding: 32px 0; }

    /* Spinner */
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 3px solid #ddd; border-top-color: #2d7d46;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin: 40px auto; display: block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .language-selector { padding: 5px 9px; border-radius: 6px; border: 1px solid #ccc; background: #f5f5f5; color: #333; font-size: 13px; cursor: pointer; }
    .language-selector:hover { background: #eee; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <button class="back-link" onclick="goToDashboard()" data-i18n="backDash">← Dashboard</button>
    <select id="languageSelector" class="language-selector">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>

  <h2 data-i18n="h2Title">🧾 Payment History</h2>
  <div class="member-id" id="member-id-display"></div>

  <div id="loading"><div class="spinner"></div></div>
  <div id="content" style="display:none"></div>
</div>

<script>
  // ── i18n ─────────────────────────────────────────────────
  var TRANSLATIONS = {
    "en": {
        "appTitle": "🏃 Misty Mountain Runners",
        "h2Title": "🧾 Payment History",
        "backDash": "← Dashboard",
        "awaitingApproval": "⏳ Awaiting Admin Approval",
        "whyUnchanged": "Why is my membership status unchanged?",
        "pendingExplainer": "Your payment submission is received and under review. Once an admin verifies the payment, your status will be updated automatically. This usually takes 1–3 business days.",
        "submitted": "Submitted",
        "paymentLocated": "✓ Payment located in bank records",
        "paymentProofsSection": "Payment Proof Submissions",
        "you": "You",
        "familyMember": "Family member",
        "viewScreenshot": "View Screenshot",
        "viewAdminQueue": "View in Admin Queue",
        "noteLabel": "Note:",
        "noConfirmedPayments": "No confirmed payments yet.",
        "confirmedPaymentsSection": "✅ Confirmed Payments",
        "coverage": "📅 Coverage:",
        "rejectedSection": "❌ Rejected / Error",
        "statusPending": "Pending",
        "statusMatched": "Matched",
        "statusApproved": "Approved",
        "statusRejected": "Rejected",
        "statusError": "Error",
        "intentIndividual": "Individual Membership",
        "intentFamily": "Family Membership",
        "intentDues": "Dues Payment",
        "codeSentTo": "Code sent to",
        "enterCodeLabel": "Enter the 6-digit code from your inbox."
    },
    "zh": {
        "appTitle": "🏃 岚山跑团",
        "h2Title": "🧾 支付记录",
        "backDash": "← 主页",
        "awaitingApproval": "⏳ 等待管理员审核",
        "whyUnchanged": "为什么我的会员资格状态没有更改？",
        "pendingExplainer": "您的支付提交已收到并在审查中。管理员验证付款后，您的状态将自动更新。通常需要 1-3 个工作日。",
        "submitted": "提交于",
        "paymentLocated": "✓ 已在银行记录中找到付款",
        "paymentProofsSection": "支付证明提交",
        "you": "您",
        "familyMember": "家庭成员",
        "viewScreenshot": "查看截图",
        "viewAdminQueue": "在管理员队列中查看",
        "noteLabel": "备注：",
        "noConfirmedPayments": "还没有已确认的支付。",
        "confirmedPaymentsSection": "✅ 已确认的支付",
        "coverage": "📅 有效期：",
        "rejectedSection": "❌ 被拒绝/错误",
        "statusPending": "待审",
        "statusMatched": "已匹配",
        "statusApproved": "已批准",
        "statusRejected": "已拒绝",
        "statusError": "错误",
        "intentIndividual": "个人会员",
        "intentFamily": "家庭会员",
        "intentDues": "会费支付",
        "codeSentTo": "验证码已发送至",
        "enterCodeLabel": "请输入您收件箱中的6位验证码。"
    }
};

  // Helper to get translated text for dynamic content
  function t(key) {
    var lang = getCurrentLanguage();
    var trans = TRANSLATIONS[lang] || TRANSLATIONS['en'];
    return trans[key] || key;
  }

  function applyTranslations(lang) {
    var trans = TRANSLATIONS[lang] || TRANSLATIONS['en'];
    var titleEl = document.getElementById('appTitle');
    if (titleEl && trans.appTitle) titleEl.textContent = trans.appTitle;
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) {
      var k = els[i].getAttribute('data-i18n');
      if (trans[k] !== undefined) els[i].textContent = trans[k];
    }
    var pls = document.querySelectorAll('[data-i18n-placeholder]');
    for (var j = 0; j < pls.length; j++) {
      var k2 = pls[j].getAttribute('data-i18n-placeholder');
      if (trans[k2] !== undefined) pls[j].placeholder = trans[k2];
    }
  }

  function getCurrentLanguage() {
    var stored = localStorage.getItem('portal_lang');
    if (stored && ['en','zh'].indexOf(stored) !== -1) return stored;
    var lang = (navigator.language || 'en').toLowerCase();
    return lang.startsWith('zh') ? 'zh' : 'en';
  }

  // Global cache for payment data (to re-render on language change)
  var cachedPaymentData = null;
  var cachedMemberData = null;

  function setLanguage(lang) {
    if (['en','zh'].indexOf(lang) !== -1) {
      localStorage.setItem('portal_lang', lang);
      var sel = document.getElementById('languageSelector');
      if (sel) sel.value = lang;
      applyTranslations(lang);
      // Re-render payment history with new language if data is cached
      if (cachedPaymentData && cachedMemberData) {
        renderPaymentHistory(cachedPaymentData, cachedMemberData);
      }
    }
  }

  function renderPaymentHistory(data, member) {
    var content = document.getElementById('content');
    var split = renderEvents(data.events || []);
    var html = '';
    html += buildPendingHTML(split.pending);
    html += buildProofsHTML(data.proofs || [], data.memberID || member.memberID);
    html += buildConfirmedHTML(data.payments || []);
    html += buildRejectedHTML(split.past);
    content.innerHTML = html || '<div class="empty">No payment activity found.</div>';
  }

  function initLanguageSelector() {
    var lang = getCurrentLanguage();
    var sel = document.getElementById('languageSelector');
    if (sel) {
      sel.value = lang;
      sel.addEventListener('change', function(e) { setLanguage(e.target.value); });
    }
    applyTranslations(lang);
  }
  document.addEventListener('DOMContentLoaded', initLanguageSelector);

  var appBaseUrl = '__SCRIPT_URL__';

  // Navigate top frame (GAS iframe requires target="_top")
  function navigateToPage(page) {
    var url = appBaseUrl + '?page=' + page;
    console.log('[MMR] navigateToPage:', url);
    var a = document.createElement('a');
    a.href = url;
    a.target = '_top';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
  }

  function goToDashboard() {
    navigateToPage('dashboard');
  }

  function callApi(fn, payload) {
    return new Promise(function(resolve, reject) {
      var req = { requestId: Math.random().toString(36).slice(2), payload: payload };
      google.script.run
        .withSuccessHandler(function(r) {
          var res = JSON.parse(r);
          if (res.ok) resolve(res.payload);
          else reject(new Error(res.errorMessage));
        })
        .withFailureHandler(function(err) { reject(err); })
        [fn](JSON.stringify(req));
    });
  }

  function badgeCls(status) {
    return 'badge badge-' + (status || 'pending').toLowerCase();
  }

  function fmt(dateStr) {
    if (!dateStr) return '—';
    var d = new Date(dateStr);
    return isNaN(d) ? dateStr : d.toLocaleDateString('en-US', {
      year: 'numeric', month: 'short', day: 'numeric'
    });
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderEvents(events) {
    // Pending/Matched events — shown at top with explanation
    var pending = events.filter(function(e) {
      return e.status === 'Pending' || e.status === 'Matched';
    });
    var past = events.filter(function(e) {
      return e.status === 'Approved' || e.status === 'Rejected' || e.status === 'Error';
    });
    return { pending: pending, past: past };
  }

  function buildPendingHTML(pending) {
    if (!pending.length) return '';
    var html = '<div class="section-title">' + t('awaitingApproval') + '</div>';
    html += '<div class="pending-explainer">';
    html += '<strong>' + t('whyUnchanged') + '</strong><br/>';
    html += t('pendingExplainer');
    html += '</div>';
    pending.forEach(function(e) {
      html += '<div class="row-card">';
      html += '<div class="row-top">';
      html += '<span class="row-intent">' + esc(e.paymentIntent) + '</span>';
      html += '<span>' +
        '<span class="' + badgeCls(e.status) + '">' + esc(e.status) + '</span>' +
        '</span>';
      html += '</div>';
      html += '<div class="row-meta">';
      html += '<span>$' + esc(e.amount) + '</span>';
      html += '<span>' + esc(e.paymentMethod) + '</span>';
      html += '<span>' + t('submitted') + ' ' + fmt(e.timestamp) + '</span>';
      if (e.status === 'Matched') {
        html += '<span>' + t('paymentLocated') + '</span>';
      }
      html += '</div>';
      if (e.notes) {
        html += '<div class="row-meta" style="margin-top:4px;color:#c0392b;">' +
          '<span>' + esc(e.notes) + '</span></div>';
      }
      html += '</div>';
    });
    return html;
  }

    // --- NEW: build proofs section ---
  function buildProofsHTML(proofs, currentMemberID) {
    if (!proofs || !proofs.length) return '';
    var html = '<div class="section-title">' + t('paymentProofsSection') + '</div>';
    proofs.forEach(function(p) {
      var isOwn = p.memberID === currentMemberID;
      var memberLabel = isOwn ? t('you') : t('familyMember') + ' ' + esc(p.memberID);

      var screenshotLink = p.screenshotFileId
        ? ' &bull; <a href="https://drive.google.com/file/d/' + esc(p.screenshotFileId) + '/view" target="_blank">' + t('viewScreenshot') + '</a>'
        : '';

      // Deep-link into admin approval queue
      var isPending = p.status === 'Pending Review' || p.status === 'Pending';
      var approvalLink = isPending
        ? ' &bull; <a href="' + appBaseUrl + '?page=admin" target="_top" '
          + 'onclick="sessionStorage.setItem(\'adminFocusProof\',\'' + esc(p.eventID) + '\');return true;"'
          + '>' + t('viewAdminQueue') + '</a>'
        : '';

      html += '<div class="row-card">';
      html += '<div class="row-top">';
      html += '<span class="row-intent">' + esc(p.eventName) + '</span>';
      html += '<span class="row-amount">$' + esc(p.amount) + '</span>';
      html += '</div>';
      html += '<div class="row-meta">';
      html += '<span>' + memberLabel + '</span>';
      html += '<span>' + fmt(p.paymentDate) + '</span>';
      html += '<span>' + esc(p.payerName) + '</span>';
      html += '<span><span class="' + badgeCls(p.status) + '">' + esc(p.status) + '</span></span>';
      html += screenshotLink + approvalLink;
      html += '</div>';
      if (p.notes) {
        html += '<div class="row-meta" style="margin-top:4px;color:#555">'
              + '<span>' + t('noteLabel') + ' ' + esc(p.notes) + '</span></div>';
      }
      html += '</div>';
    });
    return html;
  }

  // (data loading moved below after all function definitions)


  function buildConfirmedHTML(payments) {
    if (!payments.length) return '<div class="empty">' + t('noConfirmedPayments') + '</div>';
    var html = '<div class="section-title">' + t('confirmedPaymentsSection') + '</div>';
    payments.forEach(function(p) {
      html += '<div class="row-card">';
      html += '<div class="row-top">';
      html += '<span class="row-intent">' + esc(p.paymentIntent) + '</span>';
      html += '<span class="row-amount">$' + esc(p.amount) + '</span>';
      html += '</div>';
      html += '<div class="row-meta">';
      html += '<span>' + esc(p.paymentMethod) + '</span>';
      html += '<span>' + fmt(p.paymentDate) + '</span>';
      html += '<span>' + esc(p.payerName) + '</span>';
      if (p.source) html += '<span>' + esc(p.source) + '</span>';
      if (p.memoField) html += '<span>' + esc(p.memoField) + '</span>';
      html += '</div>';
      if (p.periodStart && p.periodEnd) {
        html += '<div class="period-bar">' + t('coverage') + ' ' +
          fmt(p.periodStart) + ' → ' + fmt(p.periodEnd) + '</div>';
      }
      html += '</div>';
    });
    return html;
  }

  function buildRejectedHTML(past) {
    var rejected = past.filter(function(e) {
      return e.status === 'Rejected' || e.status === 'Error';
    });
    if (!rejected.length) return '';
    var html = '<div class="section-title">' + t('rejectedSection') + '</div>';
    rejected.forEach(function(e) {
      html += '<div class="row-card">';
      html += '<div class="row-top">';
      html += '<span class="row-intent">' + esc(e.paymentIntent) + '</span>';
      html += '<span class="' + badgeCls(e.status) + '">' + esc(e.status) + '</span>';
      html += '</div>';
      html += '<div class="row-meta">';
      html += '<span>$' + esc(e.amount) + '</span>';
      html += '<span>' + fmt(e.timestamp) + '</span>';
      html += '</div>';
      if (e.notes) {
        html += '<div class="row-meta" style="margin-top:4px;color:#c62828;">' +
          '<span>Note: ' + esc(e.notes) + '</span></div>';
      }
      html += '</div>';
    });
    return html;
  }

  // ── Load data ────────────────────────────────────────────────
  var member = null;
  try { member = JSON.parse(sessionStorage.getItem('member') || 'null'); } catch(_) {}

  if (!member || !member.email) {
    navigateToPage('login');
  } else {
    document.getElementById('member-id-display').textContent =
      'Member ID: ' + (member.memberID || '—');

    callApi('getMemberPaymentHistory', {
      email: member.email,
    })
    .then(function(data) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      // Cache data for language switching
      cachedPaymentData = data;
      cachedMemberData = member;

      renderPaymentHistory(data, member);
    })
    .catch(function(err) {
      document.getElementById('loading').style.display = 'none';
      var content = document.getElementById('content');
      content.style.display = 'block';
      content.innerHTML = '<div class="empty" style="color:#c62828;">Failed to load: ' +
        esc(err.message) + '</div>';
    });
  }
</script>
</body>
</html>
