<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Misty Mountain Runners — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      padding: 40px 32px; width: 100%; max-width: 400px;
    }
    .logo { text-align: center; font-size: 40px; margin-bottom: 8px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .app-title { text-align: center; font-size: 22px; font-weight: 700; color: #1a1a1a; flex: 1; }
    .language-selector { padding: 6px 10px; border-radius: 6px; border: 1px solid #ddd; background: #f9f9f9; color: #333; font-size: 13px; font-weight: 500; cursor: pointer; }
    .language-selector:hover { background: #f0f0f0; }
    .subtitle { text-align: center; font-size: 14px; color: #777; margin-bottom: 28px; }

    /* Messages */
    .msg { font-size: 14px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .msg.success { background: #e8f5e9; color: #2d7d46; display: block; }
    .msg.error   { background: #fdecea; color: #c62828; display: block; }
    .msg.info    { background: #e3f2fd; color: #1565c0; display: block; }

    /* Inputs */
    input[type="email"], input[type="text"] {
      width: 100%; padding: 13px 14px;
      border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 15px; margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #2d7d46; outline: none; }

    /* Buttons */
    .btn {
      width: 100%; padding: 13px;
      border-radius: 10px; border: none;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
      margin-bottom: 10px;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary   { background: #2d7d46; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #235f36; }
    .btn-google    { background: #fff; color: #333; border: 1.5px solid #ddd; }
    .btn-google:hover:not(:disabled) { background: #f5f5f5; }
    .btn-outline   { background: #fff; color: #2d7d46; border: 1.5px solid #2d7d46; }
    .btn-outline:hover:not(:disabled) { background: #f0f8f2; }
    .btn-ghost {
      background: none; border: none; color: #888;
      font-size: 13px; cursor: pointer; padding: 4px 0;
      text-decoration: underline; width: auto; margin-bottom: 0;
    }
    .btn-ghost:hover { color: #444; }

    .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: #bbb; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #eee; }

    /* Result boxes */
    .result-box {
      border-radius: 10px; padding: 18px 16px; margin-bottom: 20px; text-align: center;
    }
    .result-box.returning { background: #e8f5e9; border: 1px solid #a5d6a7; }
    .result-box.new-member { background: #e3f2fd; border: 1px solid #90caf9; }
    .result-box .result-icon { font-size: 28px; margin-bottom: 6px; }
    .result-box h3 { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
    .result-box p  { font-size: 13px; color: #555; line-height: 1.5; }

    /* OTP sub-section */
    .otp-section { margin-top: 20px; border-top: 1px solid #f0f0f0; padding-top: 20px; }
    .otp-section label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; }

    /* Spinner */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; margin-right: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #dbg { font-size: 11px; color: #bbb; margin-top: 12px; text-align: center; }

    /* not show Google loginn for now since it requires extra setup and isn't the primary path in the current codebase */
    #googleBtn, #googleSpinner, .divider { display: none; }

  </style>
</head>
<body>
<div class="card">
  <div class="logo">🏃</div>
  <div class="header-row">
    <div class="app-title" id="appTitle" data-i18n="appTitle">Misty Mountain Runners</div>
    <select id="languageSelector" class="language-selector">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>

  <!-- ═══════════════════════════════════════════
       STATE 1: Email entry + Google sign-in
  ════════════════════════════════════════════ -->
  <div id="state-email">
    <p class="subtitle" data-i18n="subtitle">Sign in or register</p>
    <div id="msg-email" class="msg"></div>

    <button class="btn btn-google" id="googleBtn" onclick="loginWithGoogle()" style="display:none;">
      <img src="https://www.google.com/favicon.ico"
           style="width:16px;height:16px;vertical-align:middle;margin-right:8px;" />
      Sign in with Google
    </button>
    <span id="googleSpinner" style="display:none;"><span class="spinner"></span></span>

    <div class="divider"  style="display:none;">or sign in with email</div>

    <input type="email" id="emailInput"
           placeholder="your@email.com"
           onkeydown="if(event.key==='Enter') checkEmail()" />
    <button class="btn btn-primary" id="checkEmailBtn" onclick="checkEmail()" data-i18n="checkEmailBtn">Continue →</button>
  </div>

  <!-- ═══════════════════════════════════════════
       STATE 2A: Returning member found
  ════════════════════════════════════════════ -->
  <div id="state-returning" style="display:none">
    <div class="result-box returning">
      <div class="result-icon">👋</div>
      <h3><span data-i18n="welcomeBack">Welcome back</span>, <span id="returning-name"></span>!</h3>
      <p><span data-i18n="memberIDLabel">Member ID</span>: <strong id="returning-memberid"></strong></p>
    </div>

    <div id="msg-returning" class="msg"></div>

    <div class="otp-section">
      <label data-i18n="otpLabel">Enter your one-time login code, or request a new one.</label>
      <input type="text" id="otpInput-returning"
             placeholder="6-digit code" maxlength="6"
             inputmode="numeric" autocomplete="one-time-code"
             onkeydown="if(event.key==='Enter') verifyOtp('returning')" />
      <button class="btn btn-primary" id="verifyBtn-returning"
              onclick="verifyOtp('returning')" data-i18n="verifyBtn">
        Verify Code →
      </button>
      <button class="btn btn-outline" id="sendBtn-returning"
              onclick="sendOtp('returning')" data-i18n="sendNewCodeBtn">
        Send Me a New Code
      </button>
      <button class="btn-ghost" onclick="goBack()" data-i18n="backBtn">← Try a different email</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       STATE 2B: Email not found — ask intent
  ════════════════════════════════════════════ -->
  <div id="state-new-ask" style="display:none">
    <div class="result-box new-member">
      <div class="result-icon">✉️</div>
      <h3 data-i18n="noAccountTitle">No account found</h3>
      <p>We don't have a record for<br/><strong id="new-ask-email"></strong></p>
    </div>

    <div id="msg-new-ask" class="msg"></div>
    <p style="font-size:14px;color:#444;margin-bottom:16px;text-align:center;" data-i18n="areYouNewMember">
      Are you a new member?
    </p>

    <button class="btn btn-primary" id="newMemberYesBtn"
            onclick="startNewMemberOtp()" data-i18n="newMemberYes">
      Yes — Register Me →
    </button>
    <button class="btn-ghost" style="display:block;text-align:center;width:100%;margin-top:4px;"
            onclick="goBack()" data-i18n="newMemberNo">
      ← No, go back and change email
    </button>
  </div>

  <!-- ═══════════════════════════════════════════
       STATE 2B-verify: New member OTP entry
  ════════════════════════════════════════════ -->
  <div id="state-new-verify" style="display:none">
    <div class="result-box new-member">
      <div class="result-icon">✉️</div>
      <h3 data-i18n="verifyEmailTitle">Verify your email</h3>
      <p>Code sent to<br/><strong id="new-verify-email"></strong></p>
    </div>

    <div id="msg-new-verify" class="msg"></div>

    <div class="otp-section">
      <label data-i18n="codeFromInbox">Enter the 6-digit code from your inbox.</label>
      <input type="text" id="otpInput-new"
             placeholder="6-digit code" maxlength="6"
             inputmode="numeric" autocomplete="one-time-code"
             onkeydown="if(event.key==='Enter') verifyOtp('new')" />
      <button class="btn btn-primary" id="verifyBtn-new"
              onclick="verifyOtp('new')" data-i18n="verifyBtn">
        Verify Code →
      </button>
      <button class="btn btn-outline" id="sendBtn-new"
              onclick="sendOtp('new')" data-i18n="resendCodeBtn">
        Resend Code
      </button>
      <button class="btn-ghost" onclick="goBack()" data-i18n="goBackBtn">← Go back</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       FINAL: Continue button (after OTP verified)
  ════════════════════════════════════════════ -->
  <div id="state-continue" style="display:none">
    <div id="continue-msg" style="margin-bottom:20px;"></div>
    <button class="btn btn-primary" id="continueBtn" onclick="onContinueClick()" data-i18n="continueBtn">
      Continue →
    </button>
  </div>

  <div id="dbg"></div>
</div>

<script>
  // ── i18n ─────────────────────────────────────────────────
  var TRANSLATIONS = {
    "en": {
        "appTitle": "🏃 Misty Mountain Runners",
        "subtitle": "Sign in or register",
        "checkEmailBtn": "Continue →",
        "checking": "Checking",
        "otpLabel": "Enter your one-time login code, or request a new one.",
        "verifyBtn": "Verify Code →",
        "verifying": "Verifying",
        "sending": "Sending",
        "sendNewCodeBtn": "Send Me a New Code",
        "resendCodeBtn": "Resend Code",
        "backBtn": "← Try a different email",
        "welcomeBack": "Welcome back",
        "memberIDLabel": "Member ID",
        "noAccountTitle": "No account found",
        "newMemberYes": "Yes — Register Me →",
        "newMemberNo": "No — Try a different email",
        "sendingCode": "Sending code",
        "areYouNewMember": "Are you a new member?",
        "verifyEmailTitle": "Verify your email",
        "codeFromInbox": "Enter the 6-digit code from your inbox.",
        "goBackBtn": "← Go back",
        "otpInfoMsg": "Enter your login code from your email, or click below to request a new one.",
        "continueBtn": "Continue →",
        "loading": "Loading",
        "invalidEmail": "Please enter a valid email address.",
        "emailVerified": "Email verified!",
        "setupAccount": "Let's set up your account for"
    },
    "zh": {
        "appTitle": "🏃 岚山跑团",
        "subtitle": "登录或注册",
        "checkEmailBtn": "继续 →",
        "checking": "正在检查",
        "otpLabel": "请输入一次性验证码，或申请新验证码。",
        "verifyBtn": "验证 →",
        "verifying": "正在验证",
        "sending": "正在发送",
        "sendNewCodeBtn": "发送新验证码",
        "resendCodeBtn": "重新发送验证码",
        "backBtn": "← 更换邮箱",
        "welcomeBack": "欢迎回来",
        "memberIDLabel": "会员编号",
        "noAccountTitle": "未找到账号",
        "newMemberYes": "是，帮我注册 →",
        "newMemberNo": "否 — 更换邮箱",
        "sendingCode": "正在发送验证码",
        "areYouNewMember": "您是新会员吗？",
        "verifyEmailTitle": "验证您的邮箱",
        "codeFromInbox": "请输入您收件箱中的6位验证码。",
        "goBackBtn": "← 返回",
        "otpInfoMsg": "请输入您邮箱中的登录码，或点击下方申请新验证码。",
        "continueBtn": "继续 →",
        "loading": "加载中",
        "invalidEmail": "请输入有效的电子邮件地址。",
        "emailVerified": "电子邮件已验证！",
        "setupAccount": "让我们为以下账户设置您的信息"
    }
};

  function applyTranslations(lang) {
    var t = TRANSLATIONS[lang] || TRANSLATIONS['en'];
    console.log('[MMR][login] applyTranslations(' + lang + ') - found', Object.keys(t).length, 'translation keys');
    var titleEl = document.getElementById('appTitle');
    if (titleEl && t.appTitle) titleEl.textContent = t.appTitle;
    var els = document.querySelectorAll('[data-i18n]');
    console.log('[MMR][login] found', els.length, 'elements with data-i18n attribute');
    for (var i = 0; i < els.length; i++) {
      var k = els[i].getAttribute('data-i18n');
      if (t[k] !== undefined) {
        console.log('[MMR][login] translating [data-i18n="' + k + '"] to "' + t[k] + '"');
        els[i].textContent = t[k];
      }
    }
    var pls = document.querySelectorAll('[data-i18n-placeholder]');
    for (var j = 0; j < pls.length; j++) {
      var k2 = pls[j].getAttribute('data-i18n-placeholder');
      if (t[k2] !== undefined) pls[j].placeholder = t[k2];
    }
  }

  // Helper to get translated text for dynamic button updates
  function t(key) {
    var lang = getCurrentLanguage();
    var trans = TRANSLATIONS[lang] || TRANSLATIONS['en'];
    return trans[key] || key;
  }

  function getCurrentLanguage() {
    var stored = localStorage.getItem('portal_lang');
    if (stored && ['en','zh'].indexOf(stored) !== -1) return stored;
    var lang = (navigator.language || 'en').toLowerCase();
    return lang.startsWith('zh') ? 'zh' : 'en';
  }

  function setLanguage(lang) {
    if (['en','zh'].indexOf(lang) !== -1) {
      localStorage.setItem('portal_lang', lang);
      var sel = document.getElementById('languageSelector');
      if (sel) sel.value = lang;
      console.log('[MMR][login] setLanguage(' + lang + ')');
      applyTranslations(lang);
    }
  }

  function initSessionConfig() {
    // Pre-load config on page load to avoid repeated API calls during session
    var cached = getSessionConfig();
    if (cached) {
      console.log('[MMR][login] using cached config from sessionStorage');
      return; // Already loaded, skip server call
    }
    // Load config for this session (triggers server-side cache per sessionID)
    callApi('initializeSessionConfig', { sessionID: SESSION_ID })
      .then(function(data) {
        setSessionConfig(data.config || {});
        console.log('[MMR][login] session config initialized and cached');
      })
      .catch(function(err) {
        console.warn('[MMR][login] failed to initialize session config:', err);
        // Gracefully continue even if config load fails
      });
  }

  function initLanguageSelector() {
    var lang = getCurrentLanguage();
    var sel = document.getElementById('languageSelector');
    if (sel) {
      sel.value = lang;
      sel.addEventListener('change', function(e) { setLanguage(e.target.value); });
    }
    applyTranslations(lang);
  }

  function onPageReady() {
    initLanguageSelector();
    initSessionConfig(); // Pre-load config to avoid repeated API calls
  }

  document.addEventListener('DOMContentLoaded', onPageReady);

  console.log('[MMR][login] page loaded, location:', window.location.href);
  var appBaseUrl = '__SCRIPT_URL__';

  // Navigate top frame (GAS iframe requires target="_top")
  function navigateToPage(page) {
    var url = appBaseUrl + '?page=' + page;
    console.log('[MMR] navigateToPage:', url);
    var a = document.createElement('a');
    a.href = url;
    a.target = '_top';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
  }
  var pendingPage = 'dashboard';
  var currentEmail = '';

  // ── Session Config Cache ──────────────────────────────────
  // Store config in sessionStorage (shared across pages within same session)
  // to avoid repeated API calls. Cache key doesn't include SESSION_ID because
  // we want to reuse config across multiple page navigations.
  function getSessionConfig() {
    var cached = sessionStorage.getItem('MMR_CONFIG');
    if (cached) {
      try {
        return JSON.parse(cached);
      } catch (e) {
        console.warn('[MMR][login] failed to parse cached config:', e);
      }
    }
    return null;
  }

  function setSessionConfig(config) {
    try {
      sessionStorage.setItem('MMR_CONFIG', JSON.stringify(config));
      console.log('[MMR][login] config cached in sessionStorage (persists across pages)');
    } catch (e) {
      console.warn('[MMR][login] failed to cache config:', e);
    }
  }

  // ── Utilities ──────────────────────────────────────────────

  function callApi(fn, payload) {
    console.log('[MMR][login] callApi:', fn, JSON.stringify(payload));
    return new Promise(function(resolve, reject) {
      var req = { requestId: Math.random().toString(36).slice(2), payload: payload };
      google.script.run
        .withSuccessHandler(function(r) {
          var res = JSON.parse(r);
          console.log('[MMR][login]', fn, 'response:', JSON.stringify(res.payload || res));
          if (res.ok) resolve(res.payload);
          else reject(new Error(res.errorMessage));
        })
        .withFailureHandler(function(err) {
          console.error('[MMR][login]', fn, 'failure:', err);
          reject(err);
        })
        [fn](JSON.stringify(req));
    });
  }

  function showMsg(id, text, type) {
    var el = document.getElementById('msg-' + id);
    if (!el) return;
    el.textContent = text;
    el.className = 'msg ' + type;
  }
  function clearMsg(id) {
    var el = document.getElementById('msg-' + id);
    if (el) el.className = 'msg';
  }

  function showState(name) {
    var states = ['email', 'returning', 'new-ask', 'new-verify', 'continue'];
    states.forEach(function(s) {
      var el = document.getElementById('state-' + s);
      if (el) el.style.display = (s === name) ? 'block' : 'none';
    });
    document.getElementById('dbg').textContent = 'State: ' + name;
    // Re-apply translations to newly visible state
    applyTranslations(getCurrentLanguage());
  }

  function goBack() {
    currentEmail = '';
    document.getElementById('emailInput').value = '';
    document.getElementById('otpInput-returning').value = '';
    document.getElementById('otpInput-new').value = '';
    document.getElementById('checkEmailBtn').disabled = false;
    clearMsg('email');
    showState('email');
    document.getElementById('emailInput').focus();
  }

  // ── Google OAuth ───────────────────────────────────────────

  function loginWithGoogle() {
    document.getElementById('googleBtn').disabled = true;
    document.getElementById('googleSpinner').style.display = 'inline';
    callApi('handleGoogleLogin', { email: '' })
      .then(function(data) {
        document.getElementById('googleSpinner').style.display = 'none';
        if (data.isNewMember) {
          sessionStorage.setItem('pending_email', data.email);
          showContinue(
            '<div class="result-box new-member"><div class="result-icon">✅</div>' +
            '<h3>' + t('emailVerified') + '</h3><p>' + t('setupAccount') + '<br/><strong>' +
            esc(data.email) + '</strong></p></div>',
            'newmember'
          );
        } else {
          sessionStorage.setItem('member', JSON.stringify(data.member));
          showContinue(
            '<div class="result-box returning"><div class="result-icon">✅</div>' +
            '<h3>' + t('welcomeBack') + ', ' + esc(data.member.firstName || data.member.email) + '!</h3>' +
            '<p>' + t('memberIDLabel') + ': <strong>' + esc(data.member.memberID) + '</strong></p></div>',
            'dashboard'
          );
        }
      })
      .catch(function(err) {
        document.getElementById('googleSpinner').style.display = 'none';
        document.getElementById('googleBtn').disabled = false;
        showMsg('email', err.message || 'Google sign-in failed. Try email login.', 'error');
      });
  }

  // ── STATE 1 → STATE 2: Check email in database ─────────────

  function checkEmail() {
    var email = document.getElementById('emailInput').value.trim().toLowerCase();
    if (!email || !email.includes('@')) {
      return showMsg('email', t('invalidEmail'), 'error');
    }
    currentEmail = email;
    clearMsg('email');
    var btn = document.getElementById('checkEmailBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ' + t('checking') + '…';

    callApi('lookupEmail', { email: email })
      .then(function(data) {
        btn.disabled = false;
        btn.textContent = t('checkEmailBtn');
        if (data.found) {
          // Returning member
          document.getElementById('returning-name').textContent =
            data.firstName || email;
          document.getElementById('returning-memberid').textContent =
            data.memberID || '';
          showState('returning');
          document.getElementById('otpInput-returning').focus();
          // Don't auto-send OTP — a valid code may already exist.
          // Show instructions instead; user types code from inbox or requests a new one.
          showMsg('returning', t('otpInfoMsg'), 'info');
        } else {
          // Not found — ask if new member
          document.getElementById('new-ask-email').textContent = email;
          clearMsg('new-ask');
          showState('new-ask');
        }
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'Continue →';
        showMsg('email', err.message || 'Could not check email. Please try again.', 'error');
      });
  }

  // ── OTP Send ────────────────────────────────────────────────

  function sendOtp(context) {
    // context: 'returning' | 'new'
    var btnId = 'sendBtn-' + context;
    var msgId = context === 'returning' ? 'returning' : 'new-verify';
    var btn = document.getElementById(btnId);
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ' + t('sending') + '…';
    clearMsg(msgId);

    callApi('requestEmailOtp', { email: currentEmail })
      .then(function() {
        btn.disabled = false;
        btn.textContent = context === 'returning' ? t('sendNewCodeBtn') : t('resendCodeBtn');
        showMsg(msgId, '✓ Code sent to ' + currentEmail + '. Check your inbox.', 'success');
        var inputId = context === 'returning' ? 'otpInput-returning' : 'otpInput-new';
        document.getElementById(inputId).focus();
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.textContent = context === 'returning' ? t('sendNewCodeBtn') : t('resendCodeBtn');
        showMsg(msgId, err.message || 'Failed to send code. Please try again.', 'error');
      });
  }

  // ── New member: "Yes, register me" → send OTP then show verify ──

  function startNewMemberOtp() {
    var btn = document.getElementById('newMemberYesBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ' + t('sendingCode') + '…';
    clearMsg('new-ask');

    callApi('requestEmailOtp', { email: currentEmail })
      .then(function() {
        btn.disabled = false;
        btn.textContent = t('newMemberYes');
        document.getElementById('new-verify-email').textContent = currentEmail;
        clearMsg('new-verify');
        showState('new-verify');
        document.getElementById('otpInput-new').focus();
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.textContent = t('newMemberYes');
        showMsg('new-ask', err.message || 'Failed to send code. Please try again.', 'error');
      });
  }

  // ── OTP Verify ──────────────────────────────────────────────

  function verifyOtp(context) {
    // context: 'returning' | 'new'
    var inputId = context === 'returning' ? 'otpInput-returning' : 'otpInput-new';
    var btnId   = context === 'returning' ? 'verifyBtn-returning' : 'verifyBtn-new';
    var msgId   = context === 'returning' ? 'returning' : 'new-verify';
    var otpCode = document.getElementById(inputId).value.trim();

    if (!otpCode || otpCode.length < 6) {
      return showMsg(msgId, 'Please enter the 6-digit code.', 'error');
    }

    var btn = document.getElementById(btnId);
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ' + t('verifying') + '…';
    clearMsg(msgId);

    callApi('verifyEmailOtp', { email: currentEmail, otpCode: otpCode })
      .then(function(data) {
        btn.disabled = false;
        btn.textContent = t('verifyBtn');

        if (data.otpNotFound) {
          // Stay on the same screen, but show the message from the server
          showMsg(msgId, data.message, 'info');
          return;
        }

        if (data.isNewMember) {
          sessionStorage.setItem('pending_email', data.email);
          showContinue(
            '<div class="result-box new-member"><div class="result-icon">✅</div>' +
            '<h3>' + t('emailVerified') + '</h3>' +
            '<p>' + t('setupAccount') + '<br/><strong>' + esc(data.email) + '</strong></p></div>',
            'newmember'
          );
        } else {
          sessionStorage.setItem('member', JSON.stringify(data.member));
          showContinue(
            '<div class="result-box returning"><div class="result-icon">✅</div>' +
            '<h3>' + t('welcomeBack') + ', ' + esc(data.member.firstName || data.member.email) + '!</h3>' +
            '<p>' + t('memberIDLabel') + ': <strong>' + esc(data.member.memberID) + '</strong></p></div>',
            'dashboard'
          );
        }
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.textContent = t('verifyBtn');
        showMsg(msgId, err.message || 'Invalid or expired code. Please try again.', 'error');
      });
  }

  // ── Final continue state ────────────────────────────────────

  function navigateTo(page) {
    // Use the common navigateToPage which uses target="_top"
    navigateToPage(page);
  }

  function showContinue(msgHtml, page) {
    console.log('[MMR][login] showContinue:', page);
    // Show the success message and a button to continue
    // This ensures navigation happens with user activation (click)
    document.getElementById('continue-msg').innerHTML = msgHtml;
    pendingPage = page;
    showState('continue');
  }

  function onContinueClick() {
    var btn = document.getElementById('continueBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ' + t('loading') + '…';
    navigateTo(pendingPage);
  }

  // ── HTML escape ─────────────────────────────────────────────
  function esc(str) {
    return String(str || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init: redirect if already logged in ─────────────────────
  var cached = sessionStorage.getItem('member');
  if (cached) {
    navigateTo('dashboard');
  }
</script>
</body>
</html>
