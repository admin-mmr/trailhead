<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Misty Mountain Runners — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
    .topbar { background: #2d7d46; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .topbar-left { display: flex; align-items: center; gap: 20px; flex: 1; }
    .language-selector { padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
    .language-selector:hover { background: rgba(255,255,255,0.2); }
    .topbar h1 { font-size: 18px; font-weight: 700; }
    .topbar a { color: #fff; text-decoration: none; font-size: 14px; opacity: 0.85; }
    .topbar a:hover { opacity: 1; }
    .container { max-width: 600px; margin: 32px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 28px; margin-bottom: 20px; }
    .card h2 { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 18px; }
    .welcome { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
    .member-id { font-size: 13px; color: #888; margin-bottom: 20px; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
    .status-active    { background: #e8f5e9; color: #2d7d46; }
    .status-inactive  { background: #fdecea; color: #c62828; }
    .status-expiring  { background: #fff8e1; color: #f57c00; }
    .status-pending   { background: #fff3e0; color: #e65100; padding: 8px 14px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .info-item label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.4px; display: block; margin-bottom: 2px; }
    .info-item span { font-size: 15px; color: #1a1a1a; font-weight: 500; }
    .expiry-date { font-size: 18px; font-weight: 700; }
    .expiry-date.expired  { color: #c62828; }
    .expiry-date.expiring { color: #f57c00; }
    .expiry-date.active   { color: #2d7d46; }
    /* Action buttons */
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .btn { padding: 11px 20px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-primary   { background: #2d7d46; color: #fff; }
    .btn-primary:hover { background: #235f36; }
    .btn-secondary { background: #fff; color: #2d7d46; border: 1.5px solid #2d7d46; }
    .btn-secondary:hover { background: #f0f8f2; }
    .btn-admin     { background: #5c35a8; color: #fff; }
    .btn-admin:hover { background: #4a2b8a; }
    .btn-ghost     { background: #fff; color: #555; border: 1.5px solid #ccc; }
    .btn-ghost:hover { background: #f5f5f5; border-color: #aaa; color: #333; }
    .btn-danger    { background: #fff; color: #c62828; border: 1.5px solid #c62828; }
    .btn-danger:hover { background: #fdecea; }
    .btn-pending   { background: #fff; color: #e65100; border: 1.5px solid #ffcc80; }
    .btn-pending:hover { background: #fff8e1; }
    /* Status/info messages within action area */
    .action-msg { width: 100%; padding: 12px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5; margin-bottom: 4px; }
    .action-msg-warning { background: #fff3e0; border: 1px solid #ffb74d; color: #e65100; }
    .action-msg-info    { background: #e3f2fd; border: 1px solid #90caf9; color: #1565c0; }
    .action-msg-success { background: #e8f5e9; border: 1px solid #a5d6a7; color: #2d7d46; }
    /* Profile card */
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-bottom: 16px; }
    .profile-row label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.4px; display: block; margin-bottom: 2px; }
    .profile-row span { font-size: 14px; color: #1a1a1a; }
    .profile-row span.empty { color: #bbb; font-style: italic; }
    .profile-warning { background: #fff3e0; border: 1px solid #ffb74d; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #e65100; margin-bottom: 14px; }

    /* Loading state: full-screen blocking overlay with spinner */
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; flex-direction: column; gap: 20px;
      text-align: center; color: #555; font-size: 16px;
    }
    #loading.hidden { display: none; }

    /* Spinner animation */
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e0e0e0; border-top: 3px solid #2d7d46;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #content { display: none; }
    #content.shown { display: block; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <h1 id="appTitle">🏃 Misty Mountain Runners</h1>
    <select id="languageSelector" class="language-selector">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>
  <div style="display:flex;gap:20px;align-items:center;">
    <a href="?page=profile" data-i18n="profile">Profile</a>
    <a href="?page=login" id="signOutLink" data-i18n="signOut">Sign Out</a>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div data-i18n="loadingProfile">Loading your profile…</div>
</div>

<div class="container">
  <div id="content">

    <!-- Status card -->
    <div class="card">
      <div class="welcome" id="welcomeName"></div>
      <div class="member-id" id="memberMeta"></div>
      <span class="status-badge" id="statusBadge"></span>
      <div class="info-grid">
        <div class="info-item">
          <label data-i18n="labelExpires">Membership Expires</label>
          <span class="expiry-date" id="expiryDate">—</span>
        </div>
        <div class="info-item">
          <label data-i18n="labelJoinYear">Join Year</label>
          <span id="joinYear">—</span>
        </div>
        <div class="info-item">
          <label data-i18n="labelMemberType">Membership Type</label>
          <span id="memberType">—</span>
        </div>
        <div class="info-item">
          <label data-i18n="labelDistrict">District</label>
          <span id="district">—</span>
        </div>
      </div>

      <!-- Dynamic action buttons — populated by renderActionButtons() -->
      <div class="actions" id="actionButtons">
        <span style="color:#aaa;font-size:13px;">Loading actions…</span>
      </div>
    </div>

    <!-- Profile confirmation card (Section 2) -->
    <div class="card" id="toolsCard">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
        <a href="#" id="paymentHistoryBtn" class="btn btn-primary" data-i18n="paymentHistory">Payment History</a>
        <a href="?page=admin" class="btn btn-admin" id="adminBtn" style="display:none;" data-i18n="adminPanel">Admin Panel</a>
      </div>
    </div>

    <!-- Profile confirmation card (Section 2) -->
    <div class="card" id="profileCard">
      <h2 data-i18n="profileCardTitle">Is your information accurate?</h2>
      <div id="profileWarning" class="profile-warning" style="display:none;" data-i18n="profileWarning">Some fields are empty — please update your profile.</div>
      <div class="profile-grid" id="profileGrid"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
        <a href="?page=profile" class="btn btn-secondary" data-i18n="updateProfile">Update Profile</a>
      </div>
    </div>

  </div>
</div>

<script>
  // ── i18n ─────────────────────────────────────────────────
  var TRANSLATIONS = {
    "en": {
        "appTitle": "🏃 Misty Mountain Runners",
        "profile": "Profile",
        "signOut": "Sign Out",
        "paymentHistory": "Payment History",
        "adminPanel": "Admin Panel",
        "profileCardTitle": "Is your information accurate?",
        "profileWarning": "Some fields are empty — please update your profile.",
        "updateProfile": "Update Profile",
        "viewPendingRequests": "⏳ View Pending Requests",
        "upgradePending": "⏳ Upgrade Under Review",
        "paymentPending": "⏳ Processing... Under Review",
        "submitPaymentProof": "Submit Payment Proof",
        "manageFamily": "Manage Family",
        "cancelUpgrade": "Cancel Upgrade",
        "switchToFamily": "Switch to Family",
        "upgradeToFamily": "Upgrade to Family",
        "continueToPayment": "Continue to Payment →",
        "reloadDashboard": "Reload Dashboard →",
        "labelExpires": "Membership Expires",
        "labelJoinYear": "Join Year",
        "labelMemberType": "Membership Type",
        "labelDistrict": "District",
        "labelName": "Name",
        "labelEmail": "Email",
        "labelPhone": "Phone",
        "labelWechatID": "WeChat ID",
        "notSet": "Not set",
        "payDues": "Pay Dues",
        "statusUpgradePending": "⏳ Upgrade Under Review",
        "statusPaymentPending": "⏳ Processing... Under Review",
        "statusExpiringVerySoon": "🔴 Expiring Very Soon",
        "statusRenewSoon": "🟡 Active — Renew Soon",
        "statusActive": "🟢 Active",
        "statusInactive": "🔴 Inactive"
    },
    "zh": {
        "appTitle": "🏃 岚山跑团",
        "profile": "个人资料",
        "signOut": "退出",
        "paymentHistory": "支付记录",
        "adminPanel": "管理面板",
        "profileCardTitle": "请确认您的信息是否准确",
        "profileWarning": "部分信息未填写，请更新您的个人资料。",
        "updateProfile": "更新资料",
        "viewPendingRequests": "⏳ 查看待审请求",
        "upgradePending": "⏳ 升级等待中",
        "paymentPending": "⏳ 支付待审",
        "submitPaymentProof": "提交支付证明",
        "manageFamily": "管理家庭成员",
        "cancelUpgrade": "取消升级",
        "switchToFamily": "转换为家庭会员",
        "upgradeToFamily": "升级为家庭会员",
        "continueToPayment": "继续支付 →",
        "reloadDashboard": "重新加载主页 →",
        "labelExpires": "会员到期日期",
        "labelJoinYear": "加入年份",
        "labelMemberType": "会员类型",
        "labelDistrict": "小分队",
        "labelName": "姓名",
        "labelEmail": "电子邮件",
        "labelPhone": "电话",
        "labelWechatID": "微信ID",
        "notSet": "未设置",
        "payDues": "支付会费",
        "statusUpgradePending": "⏳ 升级等待中",
        "statusPaymentPending": "⏳ 支付待审",
        "statusExpiringVerySoon": "🔴 会员即将到期，请续费",
        "statusRenewSoon": "🟡 正式会员 — 可以续费",
        "statusActive": "🟢 正式会员",
        "statusInactive": "🔴 过期或未付会员费"
    }
};

  // Helper to get translated string for dynamic labels
  function t(key) {
    var lang = getCurrentLanguage();
    var trans = TRANSLATIONS[lang] || TRANSLATIONS['en'];
    return trans[key] || key;
  }

  function applyTranslations(lang) {
    var t = TRANSLATIONS[lang] || TRANSLATIONS['en'];
    var titleEl = document.getElementById('appTitle');
    if (titleEl && t.appTitle) titleEl.textContent = t.appTitle;
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) {
      var k = els[i].getAttribute('data-i18n');
      if (t[k] !== undefined) els[i].textContent = t[k];
    }
    var pls = document.querySelectorAll('[data-i18n-placeholder]');
    for (var j = 0; j < pls.length; j++) {
      var k2 = pls[j].getAttribute('data-i18n-placeholder');
      if (t[k2] !== undefined) pls[j].placeholder = t[k2];
    }
  }

  function getCurrentLanguage() {
    var stored = localStorage.getItem('portal_lang');
    if (stored && ['en','zh'].indexOf(stored) !== -1) return stored;
    var lang = (navigator.language || 'en').toLowerCase();
    return lang.startsWith('zh') ? 'zh' : 'en';
  }

  function setLanguage(lang) {
    if (['en','zh'].indexOf(lang) !== -1) {
      localStorage.setItem('portal_lang', lang);
      var sel = document.getElementById('languageSelector');
      if (sel) sel.value = lang;
      applyTranslations(lang);
    }
  }

  function initLanguageSelector() {
    var lang = getCurrentLanguage();
    var sel = document.getElementById('languageSelector');
    if (sel) {
      sel.value = lang;
      sel.addEventListener('change', function(e) { setLanguage(e.target.value); });
    }
    applyTranslations(lang);
  }
  document.addEventListener('DOMContentLoaded', initLanguageSelector);

  var appBaseUrl = '__SCRIPT_URL__';

  // Navigate top frame (GAS iframe requires target="_top")
  function navigateToPage(page) {
    var url = appBaseUrl + '?page=' + page;
    console.log('[MMR] navigateToPage:', url);
    var a = document.createElement('a');
    a.href = url;
    a.target = '_top';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
  }
  var currentMember = null;
  var cachedEvents  = [];
  var configCache   = {};

  // Intercept relative ?page= links and navigate top frame
  document.addEventListener('click', function(e) {
    var a = e.target.closest('a[href]');
    if (a) {
      var h = a.getAttribute('href');
      if (h && h.charAt(0) === '?') {
        // Rewrite link to full URL with target="_top" before click proceeds
        a.href = appBaseUrl + h;
        a.target = '_top';
        // Don't preventDefault — let browser handle the click naturally
      }
    }
  });

  document.getElementById('signOutLink').addEventListener('click', function() {
    sessionStorage.removeItem('member');
  });

  // ---- API helper ----
  function callApi(fn, payload) {
    return new Promise(function(resolve, reject) {
      var req = { requestId: Math.random().toString(36).slice(2), payload: payload };
      google.script.run
        .withSuccessHandler(function(r) {
          var res = JSON.parse(r);
          if (res.ok) resolve(res.payload);
          else reject(new Error(res.errorMessage));
        })
        .withFailureHandler(function(err) { reject(err); })
        [fn](JSON.stringify(req));
    });
  }

  // ---- Date helpers ----
  function getDaysUntilExpiry(expirationStr) {
    if (!expirationStr) return -9999;
    var exp = new Date(expirationStr);
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.floor((exp - today) / (1000 * 60 * 60 * 24));
  }

  function fmtDate(str) {
    if (!str) return 'Not set';
    return new Date(str).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---- Status badge ----
  function renderStatusBadge(member, hasPendingPayment, pendingEvent) {
    var badgeEl  = document.getElementById('statusBadge');
    var expiryEl = document.getElementById('expiryDate');
    var days = getDaysUntilExpiry(member.expiration);
    var lang = getCurrentLanguage();
    var trans = TRANSLATIONS[lang] || TRANSLATIONS['en'];

    console.log('[MMR][dashboard] renderStatusBadge:', {
      memberStatus: member.status,
      daysUntilExpiry: days,
      hasPendingPayment: hasPendingPayment,
      pendingEvent: pendingEvent ? {type: pendingEvent.eventType, status: pendingEvent.status} : null
    });

    if (member.status === 'pending_upgrade') {
      console.log('[MMR][dashboard]   → showing: Upgrade Pending');
      badgeEl.textContent  = trans['statusUpgradePending'];
      badgeEl.className    = 'status-badge status-pending';
      expiryEl.className   = 'expiry-date expiring';
    } else if (pendingEvent) {
      // Show custom pending payment message
      console.log('[MMR][dashboard]   → showing: custom pending event message');
      var paymentDate = new Date(pendingEvent.timestamp).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      badgeEl.innerHTML = '<div style="font-weight:600;color:#e65100;">Thank you for <strong>' + esc(pendingEvent.paymentIntent) + '</strong> on <strong>' + paymentDate + '</strong>. It is Pending review. You will receive an email soon.</div>';
      badgeEl.className    = 'status-badge status-pending';
      expiryEl.className   = 'expiry-date expiring';
    } else if (hasPendingPayment) {
      console.log('[MMR][dashboard]   → showing: Payment Pending');
      badgeEl.textContent  = trans['statusPaymentPending'];
      badgeEl.className    = 'status-badge status-pending';
      expiryEl.className   = 'expiry-date expiring';
    } else if (member.status === 'active') {
      if (days <= 7) {
        console.log('[MMR][dashboard]   → showing: Expiring Very Soon');
        badgeEl.textContent = trans['statusExpiringVerySoon'];
        badgeEl.className   = 'status-badge status-inactive';
        expiryEl.className  = 'expiry-date expired';
      } else if (days <= 42) {
        console.log('[MMR][dashboard]   → showing: Active — Renew Soon');
        badgeEl.textContent = trans['statusRenewSoon'];
        badgeEl.className   = 'status-badge status-expiring';
        expiryEl.className  = 'expiry-date expiring';
      } else {
        console.log('[MMR][dashboard]   → showing: Active');
        badgeEl.textContent = trans['statusActive'];
        badgeEl.className   = 'status-badge status-active';
        expiryEl.className  = 'expiry-date active';
      }
    } else {
      // inactive
      console.log('[MMR][dashboard]   → showing: Inactive');
      badgeEl.textContent = trans['statusInactive'];
      badgeEl.className   = 'status-badge status-inactive';
      expiryEl.className  = 'expiry-date expired';
    }

    expiryEl.textContent = fmtDate(member.expiration);
  }

  // ---- Action buttons ----
  // Renders the dynamic button set based on PRDv4 §8.3 logic.
  function renderActionButtons(member, events) {
    var container = document.getElementById('actionButtons');
    container.innerHTML = '';

    var PAYMENT_TYPES = ['dues_payment', 'family_switch', 'family_upgrade', 'PaymentProof'];
    var pendingPaymentEvents = (events || []).filter(function(e) {
      return PAYMENT_TYPES.indexOf(e.eventType) !== -1 && e.status === 'Pending';
    });
    var hasPendingPayment = pendingPaymentEvents.length > 0;
    var hasAnyPending = (events || []).some(function(e) {
      return e.status === 'Pending' || e.status === 'Matched';
    });

    var days        = getDaysUntilExpiry(member.expiration);
    var REMIND_DAYS = parseInt(configCache['ReminderDaysBefore'] || '42', 10);
    var MIN_MONTHS  = parseInt(configCache['UpgradeMinMonths']   || '3', 10);
    var indivPrice  = parseFloat(configCache['IndividualPrice']  || '30');
    var familyPrice = parseFloat(configCache['FamilyPrice']      || '50');
    var upgradePrice= parseFloat(configCache['FamilyUpgradePrice']|| '20');
    var THREE_MONTHS_DAYS = MIN_MONTHS * 30;

    // ── View Pending Requests — always show when any pending event ──────────
    if (hasAnyPending) {
      addBtn(container, t('viewPendingRequests'),
        '?page=payment_history&memberId=' + member.memberID, 'btn-pending');
      // Hide main action buttons and upgrade button when pending requests exist
      document.querySelector('.actions').style.display = 'none';
      const upgradeBtn = document.querySelector('#familyCard a');
      if (upgradeBtn) upgradeBtn.style.display = 'none';
    }

    // ── Pending Upgrade state ─────────────────────────────────────────────
    if (member.status === 'pending_upgrade') {
      if (hasPendingPayment) {
        // Sub-state 1: proof submitted, awaiting review
        addMsg(container, t('paymentUnderReview'), 'action-msg-info');
      } else {
        // Sub-state 2: no proof submitted yet
        addMsg(container, t('submitProofWarning'), 'action-msg-warning');
        addBtn(container, t('submitPaymentProof'),
          '?page=payment_proof&memberId=' + member.memberID, 'btn-primary');
      }
      addActionBtn(container, t('cancelUpgrade'), 'btn-danger', function() {
        doCancelUpgrade(member);
      });
      if (member.type === 'Family') {
        addBtn(container, t('manageFamily'), '?page=family&memberId=' + member.memberID, 'btn-secondary');
      }
      return; // No further payment buttons when pending_upgrade
    }

    // ── Payment buttons (suppressed if pending payment exists) ───────────
    if (!hasPendingPayment) {
      var isInactiveOrExpiring = member.status === 'inactive' || days < REMIND_DAYS;

      if (member.type === 'Individual') {
        if (isInactiveOrExpiring) {
          // Pay Dues + Switch to Family
          addBtn(container,
            t('payDues') + ' — $' + indivPrice,
            '?page=payment&intent=' + encodeURIComponent('Individual Membership') + '&amount=' + indivPrice,
            'btn-primary');
          addActionBtn(container,
            t('switchToFamily') + ' — $' + familyPrice,
            'btn-secondary',
            function() { doInitiateSwitch(member, familyPrice); });
        } else if (days >= REMIND_DAYS && days <= THREE_MONTHS_DAYS) {
          // Both Switch and Upgrade (user's choice)
          addActionBtn(container,
            t('switchToFamily') + ' — $' + familyPrice,
            'btn-secondary',
            function() { doInitiateSwitch(member, familyPrice); });
          addActionBtn(container,
            t('upgradeToFamily') + ' — $' + upgradePrice + ' (no expiry change)',
            'btn-secondary',
            function() { doInitiateUpgrade(member, upgradePrice); });
        } else {
          // Upgrade to Family only (> 3 months remaining)
          addActionBtn(container,
            t('upgradeToFamily') + ' — $' + upgradePrice,
            'btn-secondary',
            function() { doInitiateUpgrade(member, upgradePrice); });
        }
      } else if (member.type === 'Family') {
        if (isInactiveOrExpiring) {
          addBtn(container,
            t('payDues') + ' — $' + familyPrice,
            '?page=payment&intent=' + encodeURIComponent('Family Membership') + '&amount=' + familyPrice,
            'btn-primary');
        }
        addBtn(container, t('manageFamily'),
          '?page=family&memberId=' + member.memberID, 'btn-secondary');
      }
      // submit payment proof
      addBtn(container, t('submitPaymentProof'),
        '?page=payment_proof&memberId=' + member.memberID, 'btn-primary');

    }
  }

  // ---- Button/message builder helpers ----
  function addBtn(container, label, href, cls) {
    var a = document.createElement('a');
    a.href      = href;
    a.className = 'btn ' + cls;
    a.textContent = label;
    container.appendChild(a);
  }

  function addActionBtn(container, label, cls, handler) {
    var btn = document.createElement('button');
    btn.className   = 'btn ' + cls;
    btn.textContent = label;
    btn.addEventListener('click', handler);
    container.appendChild(btn);
  }

  function addMsg(container, text, cls) {
    var div = document.createElement('div');
    div.className   = 'action-msg ' + cls;
    div.textContent = text;
    container.appendChild(div);
  }

  // ---- Initiate Switch to Family ----
  function doInitiateSwitch(member, amount) {
    if (!confirm(
      'Switch to Family membership?\n\n' +
      'Your membership type will change to Family and marked as pending until $' + amount + ' is paid.\n\n' +
      'Continue?'
    )) return;

    var btn = event.currentTarget;
    btn.disabled    = true;
    btn.textContent = 'Processing…';

    callApi('initiateSwitch', { memberID: member.memberID, email: member.email })
      .then(function(data) {
        // Update local cache so the "Continue" button navigates with correct state
        var updated = Object.assign({}, member, {
          status: 'pending_upgrade', type: 'Family', familyID: data.familyID,
        });
        sessionStorage.setItem('member', JSON.stringify(updated));
        currentMember = updated;

        // GAS iframe requires navigation from a user gesture — show Continue button
        var container = document.getElementById('actionButtons');
        container.innerHTML = '';
        addMsg(container,
          t('switchedToFamily') + amount + '. ' + t('toActivate'),
          'action-msg-success');
        var cont = document.createElement('button');
        cont.className   = 'btn btn-primary';
        cont.textContent = t('continueToPayment');
        cont.addEventListener('click', function() {
          var _a1 = document.createElement('a');
          _a1.href = appBaseUrl + '?page=payment&intent=' + encodeURIComponent('Family Membership') + '&amount=' + amount;
          _a1.target = '_top'; _a1.style.display = 'none'; document.body.appendChild(_a1); _a1.click();
        });
        container.appendChild(cont);
        // Refresh badge
        renderStatusBadge(updated, false);
      })
      .catch(function(err) {
        btn.disabled    = false;
        btn.textContent = 'Switch to Family — $' + amount;
        alert('Error: ' + (err && err.message || 'Unknown error. Please try again.'));
      });
  }

  function doInitiateUpgrade(member, amount) {

    callApi('initiateUpgrade', { memberID: member.memberID, email: member.email })
      .then(function(data) {

        });
        sessionStorage.setItem('member', JSON.stringify(updated));

        var container = document.getElementById('actionButtons');
        container.innerHTML = '';
        addMsg(container,
          t('upgradeInitiated') + amount + ' ' + t('upgradeFeeNote'),

        var cont = document.createElement('button');
        cont.className   = 'btn btn-primary';
        cont.textContent = t('continueToPayment');
        cont.addEventListener('click', function() {
          var _a2 = document.createElement('a');
          _a2.href = appBaseUrl + '?page=payment&intent=' + encodeURIComponent('Family Upgrade') + '&amount=' + amount;
          _a2.target = '_top'; _a2.style.display = 'none'; document.body.appendChild(_a2); _a2.click();
        });
        container.appendChild(cont);
        renderStatusBadge(updated, false);
      })
      .catch(function(err) {

  // ---- Cancel Upgrade ----
  function doCancelUpgrade(member) {
    if (!confirm(
      'Cancel Family upgrade?\n\n' +
      'All family members will revert to Individual membership. ' +
      'Any pending payment proof will be rejected.\n\n' +
      'Continue?'
    )) return;

    callApi('cancelUpgrade', { memberID: member.memberID, email: member.email })
      .then(function() {
        var container = document.getElementById('actionButtons');
        container.innerHTML = '';
        addMsg(container,
          t('upgradeCancelled'),
          'action-msg-success');
        var cont = document.createElement('button');
        cont.className   = 'btn btn-secondary';
        cont.textContent = t('reloadDashboard');
        cont.addEventListener('click', function() {
          navigateToPage('dashboard');
        });
        container.appendChild(cont);
      })
      .catch(function(err) {
        alert('Error: ' + (err && err.message || 'Unknown error. Please try again.'));
      });
  }

  // ---- Profile card ----
  function renderProfileCard(member) {
    // Combine first and last name
    var fullName = (member.firstName || '') + (member.lastName ? ' ' + member.lastName : '');
    var fields = [
      { labelKey: 'labelName',    label: 'Name',       value: fullName.trim() },
      { labelKey: 'labelEmail',   label: 'Email',      value: member.email },
      { labelKey: 'labelPhone',   label: 'Phone',      value: member.phoneNumber },
      { labelKey: 'labelWechatID', label: 'WeChat ID',  value: member.wechatID },
      { labelKey: 'labelDistrict', label: 'District',   value: member.district },
      { labelKey: 'labelJoinYear', label: 'Join Year',  value: member.joinYear },
    ];
    var anyEmpty = !member.firstName || !member.lastName || !member.phoneNumber;
    document.getElementById('profileWarning').style.display = anyEmpty ? 'block' : 'none';

    var grid = document.getElementById('profileGrid');
    grid.innerHTML = '';
    fields.forEach(function(f) {
      var div = document.createElement('div');
      div.className = 'profile-row';
      var lbl = document.createElement('label');
      lbl.textContent = t(f.labelKey);
      var val = document.createElement('span');
      if (f.value) {
        val.textContent = f.value;
      } else {
        val.textContent = t('notSet');
        val.className = 'empty';
      }
      div.appendChild(lbl);
      div.appendChild(val);
      grid.appendChild(div);
    });
  }

  // ---- Main render ----
  function renderMember(member, events, pendingPaymentCount, isAdmin) {
    currentMember = member;
    cachedEvents  = events || [];

    document.getElementById('welcomeName').textContent =
      'Welcome, ' + (member.firstName || member.email) + '!';
    document.getElementById('memberMeta').textContent =
      member.memberID + (member.familyID ? ' · Family ' + member.familyID : '');

    // Use the authoritative pendingPaymentCount from backend
    var hasPendingPayment = (pendingPaymentCount > 0);

    // Find the first pending event for this member
    var pendingEvent = null;
    var memberPendingEvents = (events || []).filter(function(e) {
      return e.memberID === member.memberID && e.status === 'Pending';
    });
    if (memberPendingEvents.length > 0) {
      pendingEvent = memberPendingEvents[0];
    }

    renderStatusBadge(member, hasPendingPayment, pendingEvent);

    document.getElementById('joinYear').textContent   = member.joinYear  || '—';
    document.getElementById('memberType').textContent = member.type      || '—';
    document.getElementById('district').textContent   = member.district  || '—';

    document.getElementById('paymentHistoryBtn').href =
      '?page=payment_history&memberId=' + member.memberID;

    renderProfileCard(member);
    renderActionButtons(member, events);

    // Admin button — use isAdmin from composite response (no extra API call!)
    if (isAdmin) {
      document.getElementById('adminBtn').style.display = 'inline-block';
    }

    // Hide loading overlay and show content
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').classList.add('shown');
  }

  // ---- Load ALL dashboard data in a SINGLE server call ----
  // Previously this was 4 separate google.script.run calls (getPublicConfig,
  // getOrCreateMemberProfile, getMemberPaymentHistory, getConfig).
  // Each was an independent GAS execution with no shared memory.
  // Now it's 1 call: config sheet read once, member lookup once.
  var cached = sessionStorage.getItem('member');
  var memberEmail = '';
  if (cached) { try { memberEmail = JSON.parse(cached).email || ''; } catch (_) {} }

  // Render from cache immediately while data loads in background
  if (cached) {
    try {
      var m = JSON.parse(cached);
      renderMember(m, [], 0, false); // No events or admin status from cache
    } catch (e) {
      console.error('[MMR][dashboard] failed to parse cached member:', e);
    }
  }

  // Single composite call replaces 4 separate API calls
  callApi('loadDashboardData', { email: memberEmail })
    .then(function(data) {
      console.log('[MMR][dashboard] ===== loadDashboardData response =====');
      console.log('[MMR][dashboard] member:', data.member.memberID, '| status:', data.member.status);
      console.log('[MMR][dashboard] events:', (data.events || []).length, '| pending:', data.pendingPaymentCount, '| isAdmin:', data.isAdmin);

      // Cache config in sessionStorage for other pages (profile, payment, etc.)
      if (data.config) {
        try {
          sessionStorage.setItem('MMR_CONFIG', JSON.stringify(data.config));
          // Also cache districts separately for legacy compatibility
          if (data.config.Districts) {
            var districts = data.config.Districts.split(',').map(function(d) { return d.trim(); }).filter(function(d) { return d.length > 0; });
            sessionStorage.setItem('districts_list', JSON.stringify(districts));
          }
          configCache = data.config;
        } catch (e) {
          console.warn('[MMR][dashboard] failed to cache config:', e);
        }
      }

      var pendingPaymentCount = data.pendingPaymentCount || 0;

      // Guard against server returning wrong memberID (GAS admin account fallback)
      if (cached && data.member.memberID !== currentMember?.memberID) {
        console.warn('[MMR][dashboard] server memberID mismatch — keeping cached session');
        renderMember(currentMember, data.events || [], pendingPaymentCount, data.isAdmin);
        return;
      }

      sessionStorage.setItem('member', JSON.stringify(data.member));
      renderMember(data.member, data.events || [], pendingPaymentCount, data.isAdmin);
    })
    .catch(function(err) {
      console.error('[MMR][dashboard] loadDashboardData error:', err && err.message);
      var loadingEl = document.getElementById('loading');
      loadingEl.classList.remove('hidden');
      if (!cached) {
        loadingEl.innerHTML = '<div style="font-size:18px;color:#c62828;margin-bottom:12px;">Session Expired</div><div data-i18n="sessionExpiredMsg">Please sign in again to continue.</div><br><a href="?page=login" style="color:#2d7d46;text-decoration:underline;font-weight:600;">Sign in</a>';
      } else {
        loadingEl.innerHTML = '<div style="font-size:18px;color:#c62828;margin-bottom:12px;">Connection Error</div><div data-i18n="loadError">Failed to load profile. Please refresh the page.</div>';
      }
    });

</script>
