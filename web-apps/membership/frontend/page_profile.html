<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Misty Mountain Runners — Profile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
    .topbar { background: #2d7d46; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .topbar-left { display: flex; align-items: center; gap: 20px; flex: 1; }
    .language-selector { padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
    .language-selector:hover { background: rgba(255,255,255,0.2); }
    .topbar h1 { font-size: 18px; font-weight: 700; }
    .topbar a { color: #fff; text-decoration: none; font-size: 14px; opacity: 0.85; }
    .topbar a:hover { opacity: 1; }
    .language-selector { max-width: 90px; }
    .container { max-width: 520px; margin: 32px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 28px; }
    h2 { font-size: 18px; font-weight: 700; color: #1a1a1a; margin-bottom: 24px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    input:focus, select:focus { outline: none; border-color: #2d7d46; box-shadow: 0 0 0 2px rgba(45,125,70,0.15); }
    input[readonly] { background: #f9f9f9; color: #888; cursor: default; }
    .hint { font-size: 12px; color: #999; margin-top: 4px; }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn { padding: 11px 24px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-primary { background: #2d7d46; color: #fff; }
    .btn-primary:hover { background: #235f36; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .saving-spinner {
      display: inline-block; width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-secondary { background: #fff; color: #555; border: 1.5px solid #ccc; }
    .btn-secondary:hover { background: #f5f5f5; }
    .msg { font-size: 14px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .msg.success { background: #e8f5e9; color: #2d7d46; display: block; }
    .msg.error   { background: #fdecea; color: #c62828; display: block; }

    /* Loading overlay */
    #loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; gap: 20px; text-align: center; color: #555; font-size: 16px; }
    #loading.hidden { display: none; }
    .page-spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top: 3px solid #2d7d46; border-radius: 50%; animation: spin-page 1s linear infinite; }
    @keyframes spin-page { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #errorView { display: none; text-align: center; padding: 40px 0; }
    #errorView p { color: #c62828; font-size: 15px; margin-bottom: 16px; }
    #formView { display: block; }
  </style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <h1 id="appTitle">🏃 Misty Mountain Runners</h1>
    <select id="languageSelector" class="language-selector">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>
  <a href="?page=dashboard">← <span data-i18n="navDashboard">Dashboard</span></a>
</div>

<div id="loading">
  <div class="page-spinner"></div>
  <div data-i18n="loadingProfile">Loading your profile…</div>
</div>

<div class="container">
  <div class="card">

    <!-- Error state (shown if profile fails to load and no session cache) -->
    <div id="errorView">
      <p id="errorMsg">Could not load your profile.</p>
      <a href="?page=login" class="btn btn-primary">Sign in again</a>
    </div>

    <!-- Profile form -->
    <div id="formView">
      <h2 data-i18n="pageTitle">Update Profile</h2>
      <div id="msg" class="msg"></div>

      <div class="field">
        <label data-i18n="labelEmail">Email</label>
        <input type="email" id="email" readonly />
      </div>
      <div class="field">
        <label data-i18n="labelMemberID">Member ID</label>
        <input type="text" id="memberID" readonly />
      </div>
      <div class="field">
        <label data-i18n="labelFirstName">First Name</label>
        <input type="text" id="firstName" placeholder="First name" />
      </div>
      <div class="field">
        <label data-i18n="labelLastName">Last Name</label>
        <input type="text" id="lastName" placeholder="Last name" />
      </div>
      <div class="field">
        <label data-i18n="labelPhone">Phone Number</label>
        <input type="tel" id="phoneNumber" placeholder="e.g. 917-555-1234" />
      </div>
      <div class="field">
        <label data-i18n="labelWechat">WeChat ID</label>
        <input type="text" id="wechatID" placeholder="WeChat username (optional)" />
      </div>
      <div class="field">
        <label data-i18n="labelDistrict">District</label>
        <select id="district">
          <option value="">— Select district —</option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="labelJoinYear">Join Year</label>
        <input type="number" id="joinYear" placeholder="e.g. 2019" min="2000" max="2099" />
        <div class="hint" data-i18n="joinYearHint">Year you first joined the club. You may edit this.</div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="saveBtn" onclick="saveProfile()" data-i18n="btnSave">Save Changes</button>
        <a href="?page=dashboard" class="btn btn-secondary" data-i18n="btnCancel">Cancel</a>
      </div>
    </div>

  </div>
</div>

<script>
  // ── i18n ─────────────────────────────────────────────────
  var TRANSLATIONS = {
    "en": {
        "appTitle": "🏃 Misty Mountain Runners",
        "navDashboard": "Dashboard",
        "pageTitle": "Update Profile",
        "labelEmail": "Email",
        "labelMemberID": "Member ID",
        "labelFirstName": "First Name",
        "labelLastName": "Last Name",
        "labelPhone": "Phone Number",
        "labelWechat": "WeChat ID",
        "labelDistrict": "District",
        "labelJoinYear": "Join Year",
        "joinYearHint": "Year you first joined the club. You may edit this.",
        "btnSave": "Save Changes",
        "btnCancel": "Cancel"
    },
    "zh": {
        "appTitle": "🏃 岚山跑团",
        "navDashboard": "主页",
        "pageTitle": "更新个人资料",
        "labelEmail": "电子邮件",
        "labelMemberID": "会员编号",
        "labelFirstName": "名字",
        "labelLastName": "姓氏",
        "labelPhone": "手机号码",
        "labelWechat": "微信号",
        "labelDistrict": "小分队",
        "labelJoinYear": "加入年份",
        "joinYearHint": "您加入跑团的年份，可自行修改。",
        "btnSave": "保存修改",
        "btnCancel": "取消"
    }
};

  function applyTranslations(lang) {
    var t = TRANSLATIONS[lang] || TRANSLATIONS['en'];
    var titleEl = document.getElementById('appTitle');
    if (titleEl && t.appTitle) titleEl.textContent = t.appTitle;
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) {
      var k = els[i].getAttribute('data-i18n');
      if (t[k] !== undefined) els[i].textContent = t[k];
    }
    var pls = document.querySelectorAll('[data-i18n-placeholder]');
    for (var j = 0; j < pls.length; j++) {
      var k2 = pls[j].getAttribute('data-i18n-placeholder');
      if (t[k2] !== undefined) pls[j].placeholder = t[k2];
    }
  }

  function getCurrentLanguage() {
    var stored = localStorage.getItem('portal_lang');
    if (stored && ['en','zh'].indexOf(stored) !== -1) return stored;
    var lang = (navigator.language || 'en').toLowerCase();
    return lang.startsWith('zh') ? 'zh' : 'en';
  }

  function setLanguage(lang) {
    if (['en','zh'].indexOf(lang) !== -1) {
      localStorage.setItem('portal_lang', lang);
      var sel = document.getElementById('languageSelector');
      if (sel) sel.value = lang;
      applyTranslations(lang);
    }
  }

  function initLanguageSelector() {
    var lang = getCurrentLanguage();
    var sel = document.getElementById('languageSelector');
    if (sel) {
      sel.value = lang;
      sel.addEventListener('change', function(e) { setLanguage(e.target.value); });
    }
    applyTranslations(lang);
  }
  document.addEventListener('DOMContentLoaded', initLanguageSelector);

  var appBaseUrl = '__SCRIPT_URL__';

  // Navigate top frame (GAS iframe requires target="_top")
  function navigateToPage(page) {
    var url = appBaseUrl + '?page=' + page;
    console.log('[MMR] navigateToPage:', url);
    var a = document.createElement('a');
    a.href = url;
    a.target = '_top';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
  }

  // Intercept relative ?page= links and navigate top frame
  document.addEventListener('click', function(e) {
    var a = e.target.closest('a[href]');
    if (a) {
      var h = a.getAttribute('href');
      if (h && h.charAt(0) === '?') {
        // Rewrite link to full URL with target="_top" before click proceeds
        a.href = appBaseUrl + h;
        a.target = '_top';
        // Don't preventDefault — let browser handle the click naturally
      }
    }
  });

  const SESSION_ID = Math.random().toString(36).slice(2);
  let currentMemberID = null;
  let districtsList = [];

  // ── Session Config Cache ──────────────────────────────────
  function getSessionConfig() {
    const cached = sessionStorage.getItem('MMR_CONFIG');
    if (cached) {
      try {
        return JSON.parse(cached);
      } catch (e) {
        console.warn('[MMR][profile] failed to parse cached config:', e);
      }
    }
    return null;
  }

  function setSessionConfig(config) {
    try {
      sessionStorage.setItem('MMR_CONFIG', JSON.stringify(config));
      console.log('[MMR][profile] config cached in sessionStorage');
    } catch (e) {
      console.warn('[MMR][profile] failed to cache config:', e);
    }
  }

  function callApi(fn, payload) {
    console.log('[MMR][profile] callApi:', fn, JSON.stringify(payload));
    return new Promise((resolve, reject) => {
      const req = { requestId: Math.random().toString(36).slice(2), payload };
      google.script.run
        .withSuccessHandler(r => {
          const res = JSON.parse(r);
          console.log('[MMR][profile]', fn, 'success:', JSON.stringify(res.payload || res));
          if (res.ok) resolve(res.payload);
          else reject(new Error(res.errorMessage));
        })
        .withFailureHandler(err => {
          console.error('[MMR][profile]', fn, 'failure:', err);
          reject(err);
        })
        [fn](JSON.stringify(req));
    });
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  function showError(msg) {
    console.error('[MMR][profile] showError:', msg);
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('errorMsg').textContent = msg || 'Could not load your profile.';
    document.getElementById('formView').style.display = 'none';
    document.getElementById('errorView').style.display = 'block';
  }

  function hideLoadingAndShowForm() {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('formView').style.display = 'block';
  }

  function populateDistricts(districts) {
    console.log('[MMR][profile] populateDistricts:', districts.length, 'options');
    districtsList = districts || [];
    const select = document.getElementById('district');
    // Preserve whatever value is already selected before rebuilding the options list.
    // Without this, the async fresh-fetch would wipe the selected value when it
    // rebuilds innerHTML a few seconds after the cached profile already set it.
    const preserved = select.value;
    select.innerHTML = '<option value="">— Select district —</option>';
    districts.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.trim();
      opt.textContent = d.trim();
      select.appendChild(opt);
    });
    // Re-apply the preserved value (works as long as the option exists in the list)
    if (preserved) select.value = preserved;
  }

  function loadProfile(member) {
    console.log('[MMR][profile] loadProfile memberID:', member.memberID);
    currentMemberID = member.memberID;
    document.getElementById('email').value       = member.email       || '';
    document.getElementById('memberID').value    = member.memberID    || '';
    document.getElementById('firstName').value   = member.firstName   || '';
    document.getElementById('lastName').value    = member.lastName    || '';
    document.getElementById('phoneNumber').value = member.phoneNumber || '';
    document.getElementById('wechatID').value    = member.wechatID    || '';
    document.getElementById('district').value    = member.district    || '';
    document.getElementById('joinYear').value    = member.joinYear    || '';
  }

  function saveProfile() {
    if (!currentMemberID) return showMsg('Profile not loaded. Please refresh.', 'error');
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="saving-spinner"></span> Saving…';

    const updates = {
      memberID:    currentMemberID,
      firstName:   document.getElementById('firstName').value.trim(),
      lastName:    document.getElementById('lastName').value.trim(),
      phoneNumber: document.getElementById('phoneNumber').value.trim(),
      wechatID:    document.getElementById('wechatID').value.trim(),
      district:    document.getElementById('district').value.trim(),
      joinYear:    document.getElementById('joinYear').value.trim(),
    };
    console.log('[MMR][profile] saveProfile for memberID:', currentMemberID);

    callApi('updateMemberProfile', updates)
      .then(data => {
        console.log('[MMR][profile] updateMemberProfile success, navigating to dashboard');
        if (data.member) {
          sessionStorage.setItem('member', JSON.stringify(data.member));
        }
        // Navigate immediately — no intermediate success message
        navigateToPage('dashboard');
      })
      .catch(err => {
        console.error('[MMR][profile] updateMemberProfile error:', err && err.message);
        showMsg(err.message || 'Failed to save. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Save Changes';
      });
  }

  // ---- Load from session or server ----
  const cached = sessionStorage.getItem('member');
  var memberEmail = '';
  if (cached) {
    try { memberEmail = JSON.parse(cached).email || ''; } catch (_) {}
  }

  // FIRST: Load districts (ensure dropdown is populated before we try to set member.district)
  // Try cache first (specific districts cache for backwards compatibility)
  var cachedDistricts = sessionStorage.getItem('districts_list');
  if (cachedDistricts) {
    try {
      var districts = JSON.parse(cachedDistricts);
      console.log('[MMR][profile] districts from legacy cache:', districts.length);
      populateDistricts(districts);
    } catch (e) {
      console.warn('[MMR][profile] failed to parse cached districts:', e);
    }
  } else {
    // Try new unified config cache (populated by initializeSessionConfig on login page)
    console.log('[MMR][profile] legacy districts_list cache empty, checking MMR_CONFIG cache...');
    var configCache = getSessionConfig();
    console.log('[MMR][profile] getSessionConfig() returned:', configCache ? 'object' : 'null');
    if (configCache) {
      console.log('[MMR][profile] configCache keys:', Object.keys(configCache).join(','));
      console.log('[MMR][profile] configCache.Districts:', configCache.Districts ? '"' + configCache.Districts + '"' : '(missing)');
    }
    if (configCache && configCache.Districts) {
      var districtsStr = configCache.Districts || '';
      console.log('[MMR][profile] found Districts in configCache, parsing:', '"' + districtsStr + '"');
      var districts = districtsStr
        .split(',')
        .map(function(d) { return d.trim(); })
        .filter(function(d) { return d.length > 0; });
      console.log('[MMR][profile] districts from MMR_CONFIG cache:', districts.length, 'items');
      populateDistricts(districts);
    } else {
      console.log('[MMR][profile] MMR_CONFIG cache empty or no Districts key');
    }
  }

  // Fetch fresh config and extract districts (will use server-side session cache)
  // This runs in parallel and updates the dropdown if config has changed
  callApi('getPublicConfig', { sessionID: SESSION_ID })
    .then(function(data) {
      console.log('[MMR][profile] getPublicConfig response received');
      console.log('[MMR][profile] response keys:', Object.keys(data || {}).join(','));
      console.log('[MMR][profile] full response:', JSON.stringify(data));

      // API returns { config: { Districts: "...", ... } }
      // Debug: check both data.Districts and data.config.Districts
      console.log('[MMR][profile] data.Districts:', data.Districts);
      console.log('[MMR][profile] data.config:', data.config ? 'exists' : 'missing');
      if (data.config) {
        console.log('[MMR][profile] data.config.Districts:', data.config.Districts);
      }

      // Extract districts - try data.config.Districts first, fallback to data.Districts
      var configObj = data.config || data;
      var districtsStr = (configObj && configObj.Districts) || '';

      console.log('[MMR][profile] districtsStr before split:', '"' + districtsStr + '"', '(length: ' + districtsStr.length + ')');

      var districts = [];
      if (districtsStr && districtsStr.length > 0) {
        districts = districtsStr
          .split(',')
          .map(function(d) { return d.trim(); })
          .filter(function(d) { return d.length > 0; });
      }

      console.log('[MMR][profile] districts parsed:', districts.length, 'items');
      for (var i = 0; i < districts.length; i++) {
        console.log('[MMR][profile]   [' + i + '] "' + districts[i] + '"');
      }

      if (districts.length === 0) {
        console.error('[MMR][profile] ERROR: No districts extracted! Response structure might be wrong. Received:', data);
      }

      sessionStorage.setItem('districts_list', JSON.stringify(districts));
      setSessionConfig(data); // Update unified config cache
      populateDistricts(districts);
    })
    .catch(function(err) {
      console.warn('[MMR][profile] failed to load config/districts:', err && err.message);
      console.warn('[MMR][profile] error object:', err);
      // If we have cached data, that's OK - we already showed it above
    });

  // SECOND: Load member profile (now that districts dropdown is ready)
  // Show cached member immediately if available
  if (cached) {
    try {
      const m = JSON.parse(cached);
      console.log('[MMR][profile] loaded member from sessionStorage:', m.memberID);
      loadProfile(m);
      hideLoadingAndShowForm(); // Hide loading spinner and show form with cached data
    } catch (e) {
      console.error('[MMR][profile] failed to parse cached member:', e);
    }
  }

  // Fetch fresh member profile from server
  console.log('[MMR][profile] calling getOrCreateMemberProfile with email:', memberEmail);
  callApi('getOrCreateMemberProfile', { email: memberEmail, sessionID: SESSION_ID })
    .then(function(data) {
      console.log('[MMR][profile] getOrCreateMemberProfile success, memberID:', data.member && data.member.memberID);
      sessionStorage.setItem('member', JSON.stringify(data.member));
      loadProfile(data.member);
      hideLoadingAndShowForm(); // Hide loading spinner once profile is loaded
    })
    .catch(function(err) {
      console.error('[MMR][profile] getOrCreateMemberProfile failed:', err && err.message);
      if (!cached) {
        // No cached data at all — show error card, don't navigate
        showError('Session expired or profile not found. Please sign in again.');
      }
      // If we had cached member already rendered, don't blank the page
    });
</script>
</body>
</html>
